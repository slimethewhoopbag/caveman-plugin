<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Stellar Foundry — Genesis</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap');

/* ============================================================
   GENESIS — a single-shot cinematic 2.5D parallax environment.
   One continuous ~100s forward pan at a constant speed that never
   changes: warped deep space → an artificial black hole resolves
   inside a continent-scale insertion cage → gravity beams take the
   fleet → the migration river narrows into the horizon → we cross,
   and a new universe begins on the far side.
   Built directly on the Ascension engine: same layers, starfield,
   fleet funnel, captions and chrome. The center object is not a
   shell around a star but a held singularity — photon ring,
   engineered laminar feeds, stabiliser pylons, no natural disk.
   Debug: open with #p=0.63 in the URL to seek to that progress.
   ============================================================ */

:root{
  --ink:#0b0d1f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#04050d;font-family:"Chakra Petch","Bank Gothic",Eurostile,"Segoe UI",Arial,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;transform:translateZ(0)}

/* ---------- sky ---------- */
.sky{position:absolute;inset:0;pointer-events:none}
#sky-space{background:linear-gradient(#050309 0%,#120b18 58%,#180f24 100%)}
#sky-coreglow{background:radial-gradient(70vmin at 50% 46%,rgba(255,196,120,.14),rgba(255,180,100,.04) 55%,rgba(255,180,100,0) 75%);opacity:0}
#sky-tearglow{background:radial-gradient(40vmin at 50% 46%,rgba(190,220,255,.22),rgba(160,190,255,.04) 50%,rgba(160,190,255,0) 72%);opacity:0}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:1}

/* ---------- parallax layers (forward pan = scale about the vanishing point) ---------- */
.layer{position:absolute;inset:0;will-change:transform;pointer-events:none;transform-origin:50% 46%}
.piece{position:absolute;left:0;top:0;width:100%;height:100%}
.piece svg{display:block;width:100%;height:100%}

#layer-nebfar{z-index:2}
#layer-galaxies{z-index:3}
#layer-nebmid{z-index:4}
#layer-latfar{z-index:5}
#layer-nebnear{z-index:6}
#layer-latnear{z-index:7}

/* ---------- nebulae: hand-drawn storm veils in three parallax tiers ---------- */
.nebsoft{filter:blur(26px)}
.nebfine{filter:blur(3px);opacity:.8}

/* ---------- generic ambient motion ---------- */
@keyframes driftR{from{transform:translate3d(-1.6vw,0,0)}to{transform:translate3d(1.6vw,0,0)}}
@keyframes driftL{from{transform:translate3d(1.3vw,0,0)}to{transform:translate3d(-1.3vw,0,0)}}
@keyframes bob{from{transform:translate3d(0,-.4vh,0)}to{transform:translate3d(0,.4vh,0)}}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes blink{0%,92%,100%{opacity:0}94%,97%{opacity:1}}
@keyframes blink2{0%,88%,100%{opacity:.1}90%,94%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-504}}
@keyframes latFlow{to{stroke-dashoffset:-310}}
@keyframes latFlow2{to{stroke-dashoffset:-248}}
@keyframes ringFlow{to{stroke-dashoffset:-396}}
@keyframes ringFlowA{to{stroke-dashoffset:-370}}
@keyframes ringFlowB{to{stroke-dashoffset:384}}
@keyframes gxSpin{to{transform:rotate(360deg)}}
@keyframes shardL{from{transform:translate3d(112vw,0,0) rotate(0deg)}to{transform:translate3d(-18vw,4vh,0) rotate(-320deg)}}
@keyframes shardR{from{transform:translate3d(-16vw,0,0) rotate(0deg)}to{transform:translate3d(114vw,-5vh,0) rotate(280deg)}}

.drift-r{animation:driftR 260s ease-in-out infinite alternate}
.drift-l{animation:driftL 220s ease-in-out infinite alternate}

/* ---------- settlement web (JS-generated): faint filaments + rare trunk pulses ---------- */
.fil{fill:none;stroke-linecap:round}
.st{stroke:#bcd7f6;fill:none;stroke-linecap:round;animation:latFlow 19s linear infinite}
.st2{stroke:#cfe3ff;fill:none;stroke-linecap:round;animation:latFlow2 15s linear infinite}

/* ---------- the insertion gate (scripted, not a generic layer) ---------- */
#mega{position:absolute;left:50%;top:46%;width:150vmin;height:150vmin;z-index:8;
  pointer-events:none;will-change:transform,opacity}
#mega svg{display:block;width:100%;height:100%;overflow:visible}

/* ---------- pulse ring + flashes ---------- */
#pulsering{position:absolute;left:50%;top:46%;width:100vmin;height:100vmin;z-index:9;opacity:0;
  border-radius:50%;border:2px solid rgba(223,236,255,.9);pointer-events:none;will-change:transform,opacity;
  box-shadow:0 0 46px rgba(159,220,255,.55),inset 0 0 46px rgba(159,220,255,.35)}
#pulseflash{position:absolute;inset:0;z-index:28;opacity:0;pointer-events:none;background:#eaf4ff}

/* ---------- foreground debris (fastest depth layer) ---------- */
#debris{position:absolute;inset:0;z-index:18;opacity:0;pointer-events:none}
.shard{position:absolute;left:0;will-change:transform}
.shard svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- the migration fleet (canvas, pseudo-3D funnel) ---------- */
#fleetcv{z-index:22}

/* ---------- cinema chrome ---------- */
#vignette{position:absolute;inset:0;z-index:30;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 46%,rgba(0,0,0,0) 58%,rgba(3,4,12,.46) 100%)}
.bar{position:absolute;left:0;width:100%;height:5.5vh;background:#020308;z-index:31}
#bar-t{top:0}#bar-b{bottom:0}

#caption{position:absolute;left:0;bottom:5.5vh;z-index:32;width:min(74vw,92ch);
  color:#e6eef8;font-size:clamp(13px,1.4vw,19px);line-height:1.62;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;opacity:0;
  padding:1.4em 1.9em 1.5em 5.4vw;
  background:linear-gradient(103deg,rgba(5,8,16,.78),rgba(5,8,16,.55) 58%,rgba(5,8,16,0));
  border-top:1px solid rgba(150,190,230,.30);border-right:1px solid rgba(150,190,230,.16);
  border-top-right-radius:2px;
  text-shadow:-1px -1px 0 #0a0c14,1px -1px 0 #0a0c14,-1px 1px 0 #0a0c14,1px 1px 0 #0a0c14,0 2px 3px rgba(3,5,10,.9),0 1px 12px rgba(4,8,20,.8)}
#caption::before{content:"";position:absolute;top:-1px;right:-1px;width:15px;height:15px;
  border-top:2px solid rgba(184,214,242,.72);border-right:2px solid rgba(184,214,242,.72);border-top-right-radius:2px}
#caption small{display:block;letter-spacing:.34em;font-weight:500;font-size:.72em;color:#8fb4d8;margin-bottom:.75em}
#caption .ln{display:block;opacity:0;transform:translateY(5px);
  transition:opacity .55s ease,transform .55s ease;margin-bottom:.46em}
#caption .ln.on{opacity:1;transform:none}
#caption .ln.vis{opacity:1;transform:none;transition:none}
#caption .ln.open{color:#fbfdff;font-weight:700}
#caption .ln.verdict{color:#ffb488}
#caption b{font-weight:700;color:#fbfdff;font-style:normal}
#caption .wd{white-space:nowrap}
#caption .ch{opacity:0;transition:opacity .1s linear}
#caption .ch.on{opacity:1}
#caption .redact{display:inline-block;width:8ch;height:.72em;background:#e6eef8;border-radius:1px;
  transform:translateY(.06em);box-shadow:-1px -1px 0 #0a0c14,1px -1px 0 #0a0c14,-1px 1px 0 #0a0c14,1px 1px 0 #0a0c14}
#caption .cur{display:inline-block;width:.5ch;height:.82em;background:#e6eef8;margin-left:1px;border-radius:1px;
  transform:translateY(.1em);animation:curBlink 1.05s ease-in-out infinite;
  box-shadow:-1px -1px 0 #0a0c14,1px -1px 0 #0a0c14,-1px 1px 0 #0a0c14,1px 1px 0 #0a0c14}
@keyframes curBlink{0%,100%{opacity:1}50%{opacity:.03}}

#fader{position:absolute;inset:0;background:#020308;z-index:40;pointer-events:none;transition:opacity 2.8s ease;opacity:1}
#replay{position:absolute;right:5vw;bottom:8.5vh;z-index:45;opacity:0;pointer-events:none;
  transition:opacity 2s ease;background:none;border:1px solid rgba(190,215,240,.45);
  color:#d5e4f4;font:inherit;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  padding:.55em 1.2em;cursor:pointer;border-radius:2px}
#replay.on{opacity:.85;pointer-events:auto}
#replay:hover{background:rgba(190,215,240,.12)}

.reduced .layer,.reduced svg *,.reduced .shard,.reduced .st,.reduced .st2{animation:none!important}
</style>
</head>
<body>
<div id="stage">

  <div class="sky" id="sky-space"></div>
  <div class="sky" id="sky-coreglow"></div>
  <div class="sky" id="sky-tearglow"></div>

  <canvas id="stars"></canvas>

  <!-- =================== NEBULAE — hand-drawn storm veils, three parallax tiers =================== -->
  <div class="layer" data-f="0.006" id="layer-nebfar">
    <div class="piece nebsoft drift-r" style="animation-duration:340s">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <path d="M-80 180 C260 40 520 260 840 150 C1020 90 1150 190 1060 262 C900 400 620 300 400 382 C180 460 -40 340 -80 180 Z" fill="rgba(150,52,40,.13)"/>
        <path d="M120 224 C340 124 560 264 760 194 C880 152 946 214 862 262 C700 362 480 282 322 322 C204 352 122 302 120 224 Z" fill="rgba(190,74,52,.10)"/>
        <path d="M1180 620 C1420 480 1700 560 1990 460 L1990 780 C1740 866 1500 744 1322 802 C1200 832 1122 722 1180 620 Z" fill="rgba(28,74,88,.15)"/>
        <path d="M1330 630 C1520 540 1720 600 1900 540 L1900 700 C1720 760 1540 680 1420 720 C1330 748 1290 690 1330 630 Z" fill="rgba(46,110,124,.11)"/>
      </svg>
    </div>
  </div>
  <div class="layer" data-f="0.04" id="layer-nebmid">
    <div class="piece nebsoft drift-l" style="animation-duration:280s">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <path d="M-60 762 C240 622 520 782 820 702 C1000 652 1084 742 982 802 C780 922 520 832 300 902 C120 952 -60 882 -60 762 Z" fill="rgba(92,54,132,.14)"/>
        <path d="M60 780 C280 680 520 790 720 740 C840 710 890 760 820 800 C660 880 460 820 300 860 C180 890 70 850 60 780 Z" fill="rgba(126,74,168,.10)"/>
        <path d="M1240 60 C1460 -20 1720 84 1990 22 L1990 270 C1780 342 1560 242 1402 302 C1282 342 1182 182 1240 60 Z" fill="rgba(150,52,40,.12)"/>
      </svg>
    </div>
    <div class="piece nebfine drift-l" style="animation-duration:280s">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <g fill="rgba(238,222,214,.34)">
          <circle cx="420" cy="330" r="1.1"/><circle cx="446" cy="318" r=".7"/><circle cx="404" cy="308" r=".9"/>
          <circle cx="468" cy="342" r=".6"/><circle cx="432" cy="356" r=".8"/><circle cx="390" cy="344" r=".6"/>
        </g>
        <g fill="rgba(214,226,244,.3)">
          <circle cx="1520" cy="820" r="1"/><circle cx="1548" cy="806" r=".7"/><circle cx="1500" cy="798" r=".8"/>
          <circle cx="1566" cy="836" r=".6"/><circle cx="1534" cy="848" r=".9"/>
        </g>
      </svg>
    </div>
  </div>
  <div class="layer" data-f="0.10" id="layer-nebnear">
    <div class="piece nebsoft drift-r" style="animation-duration:210s">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <path d="M300 1010 C560 900 900 980 1240 916 C1470 872 1670 950 1730 1030 L1730 1160 L260 1160 Z" fill="rgba(120,40,34,.13)"/>
        <path d="M1400 -60 C1580 -100 1800 -40 1990 -80 L1990 120 C1820 180 1640 100 1520 140 C1420 172 1350 40 1400 -60 Z" fill="rgba(30,80,96,.12)"/>
      </svg>
    </div>
    <div class="piece nebfine drift-r" style="animation-duration:210s">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
      </svg>
    </div>
  </div>

  <!-- =================== DISTANT GALAXIES (f .015) =================== -->
  <div class="layer" data-f="0.015" id="layer-galaxies">
    <div class="piece">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <!-- distant galaxies: soft cluster glows -->
        <g transform="translate(310,200)" style="animation:shimmer 26s ease-in-out infinite">
          <circle r="7" fill="rgba(196,170,214,.05)"/>
          <circle r="3.6" fill="rgba(196,170,214,.10)"/>
          <circle r="1.9" fill="rgba(196,170,214,.6)"/>
          <circle cx="6" cy="-3" r=".7" fill="rgba(196,170,214,.4)"/><circle cx="-5" cy="4" r=".6" fill="rgba(196,170,214,.34)"/><circle cx="4" cy="5" r=".5" fill="rgba(196,170,214,.3)"/><circle cx="-6" cy="-4" r=".5" fill="rgba(196,170,214,.28)"/>
        </g>
        <g transform="translate(1560,150)" style="animation:shimmer 34s ease-in-out infinite 8s">
          <circle r="7" fill="rgba(214,168,160,.05)"/>
          <circle r="3.6" fill="rgba(214,168,160,.10)"/>
          <circle r="1.9" fill="rgba(214,168,160,.55)"/>
          <circle cx="6" cy="-3" r=".7" fill="rgba(214,168,160,.4)"/><circle cx="-5" cy="4" r=".6" fill="rgba(214,168,160,.34)"/><circle cx="4" cy="5" r=".5" fill="rgba(214,168,160,.3)"/><circle cx="-6" cy="-4" r=".5" fill="rgba(214,168,160,.28)"/>
        </g>
        <g transform="translate(1710,760)" style="animation:shimmer 30s ease-in-out infinite 4s">
          <circle r="7" fill="rgba(170,196,214,.05)"/>
          <circle r="3.6" fill="rgba(170,196,214,.10)"/>
          <circle r="1.9" fill="rgba(170,196,214,.55)"/>
          <circle cx="6" cy="-3" r=".7" fill="rgba(170,196,214,.4)"/><circle cx="-5" cy="4" r=".6" fill="rgba(170,196,214,.34)"/><circle cx="4" cy="5" r=".5" fill="rgba(170,196,214,.3)"/><circle cx="-6" cy="-4" r=".5" fill="rgba(170,196,214,.28)"/>
        </g>
        <g transform="translate(210,840)" style="animation:shimmer 40s ease-in-out infinite 14s">
          <circle r="7" fill="rgba(196,178,214,.05)"/>
          <circle r="3.6" fill="rgba(196,178,214,.10)"/>
          <circle r="1.9" fill="rgba(196,178,214,.5)"/>
          <circle cx="6" cy="-3" r=".7" fill="rgba(196,178,214,.4)"/><circle cx="-5" cy="4" r=".6" fill="rgba(196,178,214,.34)"/><circle cx="4" cy="5" r=".5" fill="rgba(196,178,214,.3)"/><circle cx="-6" cy="-4" r=".5" fill="rgba(196,178,214,.28)"/>
        </g>
        <!-- irregular star grain -->
        <g fill="rgba(226,214,206,.4)">
          <circle cx="812" cy="252" r="1.3"/><circle cx="829" cy="238" r=".8"/><circle cx="798" cy="236" r="1"/>
          <circle cx="838" cy="260" r=".6"/><circle cx="816" cy="272" r="1.1"/><circle cx="800" cy="258" r=".6"/>
          <circle cx="852" cy="246" r=".7"/>
        </g>
        <g fill="rgba(206,214,232,.34)">
          <circle cx="1470" cy="866" r="1.2"/><circle cx="1490" cy="852" r=".8"/><circle cx="1456" cy="850" r="1"/>
          <circle cx="1498" cy="876" r=".6"/><circle cx="1472" cy="884" r=".9"/><circle cx="1442" cy="872" r=".6"/>
        </g>
        <g fill="rgba(222,208,214,.36)">
          <circle cx="368" cy="622" r="1.1"/><circle cx="386" cy="610" r=".7"/><circle cx="354" cy="606" r="1"/>
          <circle cx="380" cy="636" r=".9"/><circle cx="360" cy="638" r=".6"/><circle cx="340" cy="620" r=".7"/>
        </g>
        <circle cx="980" cy="120" r="2.2" fill="rgba(214,226,255,.5)" style="animation:shimmer 18s ease-in-out infinite"/>
      </svg>
    </div>
  </div>

  <!-- =================== HARVESTED-STAR LATTICE, FAR (f .10) =================== -->
  <div class="layer" data-f="0.10" id="layer-latfar">
    <div class="piece">
      <svg id="latFar" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
    </div>
  </div>

  <!-- =================== HARVESTED-STAR LATTICE, NEAR (f .30) =================== -->
  <div class="layer" data-f="0.30" id="layer-latnear">
    <div class="piece">
      <svg id="latNear" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
    </div>
  </div>

  <!-- =================== THE INSERTION GATE (scripted depth layer) =================== -->
  <div id="mega">
    <svg viewBox="-540 -540 1080 1080">
      <defs>
        <radialGradient id="gHalo">
          <stop offset="0" stop-color="rgba(255,206,140,0)"/>
          <stop offset=".56" stop-color="rgba(255,206,140,0)"/>
          <stop offset=".67" stop-color="rgba(255,206,140,.30)"/>
          <stop offset=".78" stop-color="rgba(150,120,255,.14)"/>
          <stop offset="1" stop-color="rgba(190,214,255,0)"/>
        </radialGradient>
        <linearGradient id="gDop" gradientUnits="userSpaceOnUse" x1="-240" y1="0" x2="240" y2="0">
          <stop offset="0" stop-color="#fff6e2"/>
          <stop offset=".34" stop-color="#ffcf8e"/>
          <stop offset=".68" stop-color="#d9784a"/>
          <stop offset="1" stop-color="#8a4030"/>
        </linearGradient>
        <linearGradient id="gBeam" gradientUnits="userSpaceOnUse" x1="236" y1="0" x2="164" y2="0">
          <stop offset="0" stop-color="#6fd8c8"/>
          <stop offset="1" stop-color="#eaffff"/>
        </linearGradient>
        <linearGradient id="gJetV" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="rgba(159,232,255,0)"/>
          <stop offset=".5" stop-color="rgba(191,238,255,.34)"/>
          <stop offset="1" stop-color="rgba(159,232,255,0)"/>
        </linearGradient>
      </defs>

      <g id="bhAll">

        <!-- back half of the great tilted transit ring -->
        <g id="tiltBack" opacity=".5">
          <g transform="rotate(-14)">
            <path d="M-520 0 A520 124 0 0 1 520 0" fill="none" stroke="#232b4e" stroke-width="24"/>
            <path d="M-520 0 A520 124 0 0 1 520 0" fill="none" stroke="#5d6d9e" stroke-width="3"
              stroke-dasharray="36 30" style="animation:ringFlow 30s linear infinite"/>
          </g>
        </g>

        <!-- distant machinery: dark yards and tenders on far orbits -->
        <g id="farMach" opacity="0">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="640s" repeatCount="indefinite"/>
            <g transform="rotate(18) translate(500,0)"><rect x="-14" y="-4" width="28" height="8" fill="#1c2342"/><rect x="-4" y="-9" width="8" height="5" fill="#232b4e"/><circle cx="12" cy="0" r="1.6" fill="#9fe8ff" style="animation:blink2 7s linear infinite"/></g>
            <g transform="rotate(96) translate(516,0)"><rect x="-18" y="-3" width="36" height="6" fill="#1c2342"/><circle cx="-16" cy="0" r="1.4" fill="#ffe9b8" style="animation:blink2 9s linear infinite 2s"/></g>
            <g transform="rotate(204) translate(492,0)"><rect x="-10" y="-6" width="20" height="12" fill="#1a2140"/><rect x="-2" y="-10" width="4" height="4" fill="#232b4e"/><circle cx="8" cy="-8" r="1.4" fill="#ff8f8f" style="animation:blink 11s linear infinite 4s"/></g>
            <g transform="rotate(268) translate(526,0)"><rect x="-12" y="-3" width="24" height="6" fill="#1c2342"/></g>
            <g transform="rotate(330) translate(508,0)"><rect x="-9" y="-5" width="18" height="10" fill="#1a2140"/><circle cx="10" cy="0" r="1.3" fill="#9fe8ff" style="animation:blink2 8s linear infinite 5s"/></g>
          </g>
        </g>

        <!-- outer megaring: the visible edge of something larger than the frame -->
        <g id="ringOuter" opacity="0">
          <circle r="472" fill="none" stroke="#1c2444" stroke-width="20"/>
          <circle r="486" fill="none" stroke="#161d38" stroke-width="6"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="540s" repeatCount="indefinite"/>
            <circle r="472" fill="none" stroke="#5d6d9e" stroke-width="3.5" stroke-dasharray="92 58"/>
            <g fill="#232b4e">
              <rect transform="rotate(12) translate(472 0)" x="-9" y="-17" width="18" height="34"/>
              <rect transform="rotate(102) translate(472 0)" x="-9" y="-17" width="18" height="34"/>
              <rect transform="rotate(192) translate(472 0)" x="-9" y="-17" width="18" height="34"/>
              <rect transform="rotate(282) translate(472 0)" x="-9" y="-17" width="18" height="34"/>
            </g>
            <circle transform="rotate(12) translate(472 0)" r="2.4" fill="#6fd8c8" style="animation:blink2 6s linear infinite"/>
            <circle transform="rotate(192) translate(472 0)" r="2.4" fill="#ffe9b8" style="animation:blink2 8s linear infinite 3s"/>
          </g>
        </g>

        <!-- mid ring: counter-rotating, carries the field generators -->
        <g id="ringMid" opacity="0">
          <circle r="368" fill="none" stroke="#202a4e" stroke-width="14"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="360s" repeatCount="indefinite"/>
            <circle r="368" fill="none" stroke="#9b8ae0" stroke-width="2.6" stroke-dasharray="58 40"/>
            <g transform="rotate(0)"><g transform="translate(368 0)"><circle r="9" fill="#232b4e" stroke="#3a4570" stroke-width="2"/><circle r="3" fill="#6fd8c8" style="animation:pulse 5s ease-in-out infinite"/></g></g>
            <g transform="rotate(60)"><g transform="translate(368 0)"><circle r="9" fill="#232b4e" stroke="#3a4570" stroke-width="2"/><circle r="3" fill="#9fe8ff" style="animation:pulse 6s ease-in-out infinite 1s"/></g></g>

<script>
(function(){
  "use strict";

  /* ============ the single shot ============ */
  var DUR = 100000;    // ~100s forward pan, constant speed
  var stage = document.getElementById('stage');
  var layers = [].slice.call(document.querySelectorAll('.layer')).map(function(el){
    return { el: el, f: parseFloat(el.getAttribute('data-f')) };
  });

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) document.body.classList.add('reduced');

  function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ramp(p, a, b){ return clamp01((p - a) / (b - a)); }
  function sstep(t){ return t*t*(3-2*t); }
  // piecewise-linear keyframe track: kf(p, [[p0,v0],[p1,v1],...])
  function kf(p, pts){
    for (var i = 1; i < pts.length; i++){
      if (p <= pts[i][0]){
        var a = pts[i-1], b = pts[i];
        var u = clamp01((p - a[0]) / (b[0] - a[0]));
        return a[1] + (b[1] - a[1]) * u;
      }
    }
    return pts[pts.length - 1][1];
  }
  function el(id){ return document.getElementById(id); }

  /* ============ scripted elements ============ */
  var sph        = el('mega');
  var bhAll      = el('bhAll');
  var tiltBack   = el('tiltBack'), tiltFront = el('tiltFront');
  var farMach    = el('farMach');
  var ringOuter  = el('ringOuter'), ringMid = el('ringMid'), ringInner = el('ringInner');
  var pylons     = el('pylons');
  var beams      = [el('bm1'), el('bm2'), el('bm3'), el('bm4')];
  var feeds      = el('feeds');
  var jets       = el('jets');
  var einstein   = el('einstein');
  var photon     = el('photon'), photon2 = el('photon2'), photon3 = el('photon3');
  var dopBack    = el('dopBack'), dopFront = el('dopFront'), knotG = el('knotG');
  var glint      = el('glint');
  var skyGlow    = el('sky-coreglow');
  var skyTear    = el('sky-tearglow');
  var pulseRing  = el('pulsering');
  var pulseFlash = el('pulseflash');
  var debris     = el('debris');

  /* ============ timeline (all in shot progress p) ============ */
  var SC  = [[0,.045],[.15,.085],[.40,.34],[.60,.58],[.80,.80],[.95,1.00],[1,1.05]];  // gate scale
  var SX  = [[0,3.6],[.42,0],[1,0]];                                                 // gate x drift, vw
  var BEAM_AT = [.415,.45,.485,.52];                                                 // beam ignition

  /* ============ captions — fleet log, same voice as the landing reports ============ */
  var capEl = el('caption');
  var capSm = capEl.querySelector('small');
  var capTx = capEl.querySelector('span');
  var CAPS = [
    { a:.02, b:.145, k:'Genesis 01-1',
      t:'*Old Knowledge* had believed *black holes* stored matter it ripped apart, in a dense dictionary.\nIt was not completely wrong.' },
    { a:.185, b:.37, k:'Genesis 01-2',
      t:'One theory proposed that every *singularity* marks the beginning of another universe. Beyond the *Event Horizon*, space exists once more.' },
    { a:.42, b:.585, k:'Genesis 01-3',
      t:'Yet, the *Event Horizon* is no longer the issue, but its what lay within which is of concern.\nRegardless, life is expendable, It always been.' },
    { a:.615, b:.755, k:'Genesis 01-4',
      t:'Countless births and deaths changed this. A new vision for a world beyond.\nFor the first time, the horizon remained open long enough for a fleet to pass before the *collapse* completed.' },
    { a:.775, b:.995, k:'Genesis 01-5', cps:14, fin:true,
      t:'History remembers this crossing simply as *Genesis*.' }
  ];
  var curCap = -1;

  // report reveal: sentence-by-sentence fade for logs, slow typewriter for the last
  var capT0 = 0;
  function parseCap(c){
    if (c.segs) return;
    var hard = c.t.split('\n'), segs = [], h, parts, pj, txt, first = true;
    for (h = 0; h < hard.length; h++){
      parts = hard[h].split(/(?<=[a-z0-9])\.\s+/);
      for (pj = 0; pj < parts.length; pj++){
        txt = parts[pj].trim();
        if (!txt) continue;
        if (pj < parts.length - 1) txt += '.';
        var raw = txt.split('\x01'), tk = [], ti, bi, bp;
        for (ti = 0; ti < raw.length; ti++){
          if (ti > 0) tk.push({ r: 1 });
          if (!raw[ti].length) continue;
          bp = raw[ti].split('*');
          for (bi = 0; bi < bp.length; bi++){
            if (!bp[bi].length) continue;
            tk.push(bi % 2 === 1 ? { b: bp[bi] } : bp[bi]);   // odd run = between * = bold
          }
        }
        var low = txt.toLowerCase();
        segs.push({ tk: tk, cls: first ? 'open' : (low.indexOf('no further') >= 0 || low.indexOf('day zero') >= 0 ? 'verdict' : '') });
        first = false;
      }
    }
    c.segs = segs;
  }
  function esc(s){ return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function mountCap(c, nowT){
    parseCap(c); capT0 = nowT;
    var html = '', i, j, w, ch, seg, tk, words;
    for (i = 0; i < c.segs.length; i++){
      seg = c.segs[i];
      html += '<span class="ln ' + (c.fin ? 'vis ' : '') + seg.cls + '">';
      for (j = 0; j < seg.tk.length; j++){
        tk = seg.tk[j];
        if (tk.r){ html += '<span class="redact ch"></span>'; continue; }
        var isB = tk && tk.b != null, str = isB ? tk.b : tk;
        if (isB) html += '<b>';
        if (c.fin){
          words = str.split(' ');
          for (w = 0; w < words.length; w++){
            if (w > 0) html += '<span class="ch"> </span>';
            html += '<span class="wd">';
            for (ch = 0; ch < words[w].length; ch++) html += '<span class="ch">' + esc(words[w][ch]) + '</span>';
            html += '</span>';
          }
        } else html += esc(str);
        if (isB) html += '</b>';
      }
      html += '</span>';
    }
    if (c.fin) html += '<span class="cur"></span>';
    capTx.innerHTML = html;
    c._lns = capTx.querySelectorAll('.ln');
    c._chs = c.fin ? capTx.querySelectorAll('.ch') : null;
    c._cur = c.fin ? capTx.querySelector('.cur') : null;
    c._shown = -1;
  }
  function revealCap(c, nowT){
    var elp = (nowT - capT0) / 1000;
    if (c.fin){
      var n = Math.floor(Math.max(0, elp - 0.2) * (c.cps || 12)), i;
      if (n > c._chs.length) n = c._chs.length;
      if (n === c._shown) return;
      for (i = (c._shown < 0 ? 0 : c._shown); i < n; i++) c._chs[i].classList.add('on');
      c._shown = n;
      if (n > 0 && c._cur){ var t = c._chs[n - 1]; t.parentNode.insertBefore(c._cur, t.nextSibling); }
    } else {
      for (var i2 = 0; i2 < c._lns.length; i2++) c._lns[i2].classList.add('on');
    }
  }

  /* ============ settlement web (generated, deterministic) ============
     Harvested systems gather in colony clusters. Inside a cluster, faint
     curved filaments tie the systems to a local heart; between clusters,
     a rare trunk route carries a slow pulse. No straight dotted lines. */
  var NS = 'http://www.w3.org/2000/svg';
  function curve(rnd, ax, ay, bx, by){
    var mx = (ax+bx)/2, my = (ay+by)/2;
    var dx = bx-ax, dy = by-ay, d = Math.hypot(dx,dy) || 1;
    var bow = (rnd() - .5) * .42 * d;
    return 'M' + ax.toFixed(1) + ' ' + ay.toFixed(1) +
           ' Q' + (mx - dy/d*bow).toFixed(1) + ' ' + (my + dx/d*bow).toFixed(1) +
           ' ' + bx.toFixed(1) + ' ' + by.toFixed(1);
  }
  function buildWeb(svg, nClusters, seed, near){
    var s = seed >>> 0;
    function rnd(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
    var k = near ? 1.7 : 1, ci, ni, i;
    var hearts = [];
    var mk = function(tag){ return document.createElementNS(NS, tag); };

    for (ci = 0; ci < nClusters; ci++){
      var hx = 140 + rnd()*1640, hy = 90 + rnd()*900;
      var nodes = [], cnt = near ? 2 + Math.floor(rnd()*3) : 3 + Math.floor(rnd()*4);
      for (ni = 0; ni < cnt; ni++){
        var aa = rnd()*6.2832, rr = (26 + rnd()*115) * (near ? 1.3 : 1);
        nodes.push([hx + Math.cos(aa)*rr, hy + Math.sin(aa)*rr*.72, rnd()]);
      }
      hearts.push([hx, hy, nodes]);
    }

    // trunk routes between neighbouring cluster hearts — few, slow, faint
    var order = hearts.slice().sort(function(a,b){ return a[0]-b[0]; });
    for (i = 1; i < order.length; i++){
      if (rnd() < .3) continue;   // some clusters stay dark — irregular, not a chain
      var tr = mk('path');
      tr.setAttribute('d', curve(rnd, order[i-1][0], order[i-1][1], order[i][0], order[i][1]));
      tr.setAttribute('class', near ? 'st2' : 'st');
      tr.setAttribute('stroke-width', (near ? 1.1 : .9).toFixed(1));
      tr.setAttribute('stroke-opacity', near ? '.20' : '.15');
      tr.setAttribute('stroke-dasharray', '2 60');
      tr.style.animationDelay = (-rnd()*22).toFixed(1) + 's';
      tr.style.animationDuration = (14 + rnd()*12).toFixed(1) + 's';
      svg.appendChild(tr);
    }

    for (ci = 0; ci < hearts.length; ci++){
      var hx2 = hearts[ci][0], hy2 = hearts[ci][1], nodes2 = hearts[ci][2];

      // filaments: static, faint, curved — infrastructure, not constellation lines
      for (ni = 0; ni < nodes2.length; ni++){
        if (rnd() < .22) continue;   // stray systems stay unconnected
        var f = mk('path');
        f.setAttribute('d', curve(rnd, hx2, hy2, nodes2[ni][0], nodes2[ni][1]));
        f.setAttribute('class', 'fil');
        f.setAttribute('stroke', 'rgba(162,192,238,' + (.05 + rnd()*.07).toFixed(3) + ')');
        f.setAttribute('stroke-width', (.5 + rnd()*.6).toFixed(2));
        svg.appendChild(f);
      }

      // cluster heart: a settled hub with a soft halo
      var hh = mk('circle');
      hh.setAttribute('cx', hx2); hh.setAttribute('cy', hy2);
      hh.setAttribute('r', 7 * k);
      hh.setAttribute('fill', 'rgba(226,206,168,.06)');
      svg.appendChild(hh);
      var hc = mk('circle');
      hc.setAttribute('cx', hx2); hc.setAttribute('cy', hy2);
      hc.setAttribute('r', 1.7 * k);
      hc.setAttribute('fill', '#ecd9b6');
      svg.appendChild(hc);

      for (ni = 0; ni < nodes2.length; ni++){
        var px = nodes2[ni][0], py = nodes2[ni][1], rv = nodes2[ni][2];
        var warm = rv < 0.62;   // most systems in the corridor are harvested — dimmed amber
        var halo = mk('circle');
        halo.setAttribute('cx', px); halo.setAttribute('cy', py);
        halo.setAttribute('r', (4 + rv*4.5) * k);
        halo.setAttribute('fill', warm ? 'rgba(246,214,168,.07)' : 'rgba(191,222,255,.08)');
        svg.appendChild(halo);
        var core = mk('circle');
        core.setAttribute('cx', px); core.setAttribute('cy', py);
        core.setAttribute('r', ((warm ? .9 : 1.2) + rv*.9) * k);
        core.setAttribute('fill', warm ? '#e8c9a0' : '#dfe9ff');
        if (rv > 0.78) core.style.animation = 'shimmer ' + (5 + rv*6).toFixed(1) + 's ease-in-out infinite ' + (-rv*5).toFixed(1) + 's';
        svg.appendChild(core);
        if (warm){   // each harvested star wears its own partial shell
          var ring = mk('circle');
          ring.setAttribute('cx', px); ring.setAttribute('cy', py);
          ring.setAttribute('r', 3.8 * k);
          ring.setAttribute('fill', 'none');
          ring.setAttribute('stroke', 'rgba(255,190,120,.34)');
          ring.setAttribute('stroke-width', (0.65 * k).toFixed(2));
          svg.appendChild(ring);
          // settlement specks in orbit — the lived-in read
          var sp1 = mk('circle');
          sp1.setAttribute('cx', px + (rnd()*10 - 5) * k); sp1.setAttribute('cy', py + (5 + rnd()*4) * k);
          sp1.setAttribute('r', (0.55 * k).toFixed(2));
          sp1.setAttribute('fill', 'rgba(210,226,250,.4)');
          svg.appendChild(sp1);
          if (rnd() < .5){
            var sp2 = mk('circle');
            sp2.setAttribute('cx', px + (rnd()*12 - 6) * k); sp2.setAttribute('cy', py - (5 + rnd()*4) * k);
            sp2.setAttribute('r', (0.5 * k).toFixed(2));
            sp2.setAttribute('fill', 'rgba(226,214,190,.34)');
            svg.appendChild(sp2);
          }
        }
      }
    }
  }
  buildWeb(el('latFar'), 11, 20260718, false);
  buildWeb(el('latNear'), 4, 71802602, true);

  /* ============ starfield canvas: forward streaming + lensing ============ */
  var starCv = el('stars');
  var starCx = starCv.getContext('2d');
  var fleetCv = el('fleetcv');
  var fleetCx = fleetCv.getContext('2d');
  var W = 0, H = 0, DPR = 1, maxR = 1, vmin = 1;

  var starList = [];
  function seedStars(){
    starList.length = 0;
    var n = Math.round(W * H / 5200);
    for (var i = 0; i < n; i++){
      starList.push({
        a: Math.random() * 6.2832,
        d: Math.sqrt(Math.random()) * 1.1,
        z: 0.15 + Math.random() * 0.85,
        r: Math.random() < 0.85 ? (0.4 + Math.random()*0.8) : (1.1 + Math.random()*0.9),
        tw: 2 + Math.random()*5, ph: Math.random()*Math.PI*2,
        warm: Math.random() < 0.14
      });
    }
  }
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    vmin = Math.min(W, H);
    maxR = Math.hypot(W, H) * 0.62;
    starCv.width = Math.round(W*DPR); starCv.height = Math.round(H*DPR);
    starCx.setTransform(DPR,0,0,DPR,0,0);
    fleetCv.width = Math.round(W*DPR); fleetCv.height = Math.round(H*DPR);
    fleetCx.setTransform(DPR,0,0,DPR,0,0);
    seedStars();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ============ the migration fleet — pseudo-3D funnel ============
     Purpose-built cinematic vessels, not the gameplay sprites. Every ship
     rides its own perfectly straight line from a start spread across the
     lower half of the frame to the sphere's central aperture, at constant
     world speed. Screen position is a perspective projection, so vessels
     near the camera are large, fast and far apart, while the same column
     compresses into a dense, slow, narrowing river at the gate. Depth
     classes travel at slightly different world speeds for parallax.
     Deterministic in p — seeking and replay stay exact. */
  var GATE = { x:.50, y:.46 };              // fraction of W / H
  var ZSPAN = 15;                           // depth of the corridor, in near-plane units
  var FLEET = [];
  (function buildFleet(){
    var s2 = 89131721 >>> 0;
    function rnd(){ s2 = (s2 * 1664525 + 1013904223) >>> 0; return s2 / 4294967296; }
    function spawn(cls, n, spd, len, lenJ, wr){
      for (var i = 0; i < n; i++){
        var side = rnd() < .5 ? -1 : 1;
        FLEET.push({
          cls: cls,
          ox: side * (62 + rnd()*46),       // start offset from gate, vw — offscreen at the near plane
          oy: 9 + rnd()*46,                 // vh — always the lower half
          ph: rnd(),                        // loop phase
          spd: spd,                         // corridor crossings per shot (per class)
          L: (len + (rnd()*2 - 1) * lenJ),  // hull length at the near plane, vw
          wr: wr,                           // stern half-width / length
          warm: rnd() < .3,
          fl: rnd()*6.2832,                 // engine flicker phase
          w: 0
        });
      }
    }
    //     class      n   speed  len  jit  width
    spawn('cap',      5,  1.30, 17.0, 3.5, .15);
    spawn('med',     18,  1.65,  6.2, 1.6, .17);
    spawn('sml',    300,  2.00,  1.7,  .7, .19);
  })();

  // one vessel, drawn from a shallow rear three-quarter: the hull tapers
  // away from the camera, the stern face carries the engine light. Ships
  // never rotate or bank — the heading along each straight lane is fixed.
  function drawShip(c, sp, x, y, ang, L, a, now, lk){
    c.save();
    c.translate(x, y);
    c.rotate(ang);                       // +x points down the lane, away from us
    if (lk > 0.01) c.scale(1 - lk * .25, 1 + lk * .9);   // tangential lensing smear
    var hw = L * sp.wr;                  // stern half-height
    var eCol = sp.warm ? '#ffd9a8' : '#9fe8ff';
    var flick = .8 + .2 * Math.sin(now * .006 + sp.fl);

    if (L < 6){
      // distant traffic: a tapering streak collapsing to a point of light
      if (L > 2.2){
        c.globalAlpha = a * .85;
        c.strokeStyle = '#39406a';
        c.lineWidth = Math.max(L * .26, .7);
        c.beginPath(); c.moveTo(-L*.5, 0); c.lineTo(L*.5, 0); c.stroke();
      }
      c.globalAlpha = a * flick;
      c.fillStyle = eCol;
      c.beginPath(); c.arc(-L*.5, 0, Math.max(L*.17, .7), 0, 6.2832); c.fill();
      c.restore();
      return;
    }

    c.globalAlpha = a;
    // keel side, in shadow
    c.fillStyle = '#242c50';
    c.beginPath();
    c.moveTo(-L*.5, -hw*.42);
    c.lineTo(L*.5, -hw*.05);
    c.lineTo(L*.5, hw*.10);
    c.lineTo(-L*.46, hw);
    c.closePath(); c.fill();
    // dorsal face, catching the corridor light
    c.fillStyle = '#3c4674';
    c.beginPath();
    c.moveTo(-L*.5, -hw);
    c.lineTo(L*.5, -hw*.13);
    c.lineTo(L*.5, -hw*.03);
    c.lineTo(-L*.5, -hw*.38);
    c.closePath(); c.fill();
    // graphic rim along the dorsal edge
    c.strokeStyle = 'rgba(170,189,234,.85)';
    c.lineWidth = Math.max(L * .011, .6);
    c.beginPath(); c.moveTo(-L*.5, -hw); c.lineTo(L*.5, -hw*.13); c.stroke();

    if (sp.cls === 'cap'){
      // engineering block astern + a low bridge fin
      c.fillStyle = '#2e3760';
      c.fillRect(-L*.44, -hw*1.34, L*.17, hw*.5);
      c.strokeStyle = 'rgba(170,189,234,.6)';
      c.beginPath(); c.moveTo(-L*.44, -hw*1.34); c.lineTo(-L*.27, -hw*1.34); c.stroke();
      c.fillStyle = '#333c66';
      c.fillRect(-L*.06, -hw*1.12, L*.10, hw*.32);
      // lit flank windows, sparse
      c.fillStyle = 'rgba(191,238,255,.8)';
      var wx;
      for (wx = 0; wx < 4; wx++){
        c.fillRect(-L*.32 + wx * L*.16, -hw*.22, Math.max(L*.012, .8), Math.max(L*.008, .6));
      }
      // slow nav blink at the nose
      if ((now / 1000 + sp.fl) % 6 < .18){
        c.fillStyle = '#ffd9d0';
        c.beginPath(); c.arc(L*.49, -hw*.08, Math.max(L*.012, .9), 0, 6.2832); c.fill();
      }
    } else if (sp.cls === 'med'){
      c.fillStyle = '#333c66';
      c.fillRect(-L*.3, -hw*1.16, L*.13, hw*.36);
      c.fillStyle = 'rgba(191,238,255,.7)';
      c.fillRect(-L*.1, -hw*.2, Math.max(L*.018, .8), Math.max(L*.012, .6));
    }

    // stern cap + engines facing the camera
    c.fillStyle = '#151b36';
    c.fillRect(-L*.5 - L*.035, -hw*.96, L*.055, hw*1.92);
    var nE = sp.cls === 'cap' ? 3 : sp.cls === 'med' ? 2 : 1, k;
    for (k = 0; k < nE; k++){
      var ey = (k - (nE - 1)/2) * hw * .84;
      c.globalAlpha = a * .3 * flick;
      c.fillStyle = eCol;
      c.beginPath(); c.arc(-L*.5 - L*.02, ey, hw*.30, 0, 6.2832); c.fill();
      c.globalAlpha = a * flick;
      c.fillStyle = sp.warm ? '#ffedd2' : '#dff6ff';
      c.beginPath(); c.arc(-L*.5 - L*.02, ey, Math.max(hw*.15, .7), 0, 6.2832); c.fill();
    }
    c.restore();
  }

  /* ============ main loop ============ */
  var t0 = null, lastT = null;
  var replayBtn = el('replay');
  var fader = el('fader');
  var done = false, endFading = false;
  var seek = parseFloat((location.hash.match(/p=([\d.]+)/) || [])[1]);

  function frame(now){
    if (t0 === null){
      t0 = now;
      if (!isNaN(seek)) t0 = now - clamp01(seek) * DUR;
      lastT = now;
    }
    var dt = Math.min((now - lastT)/1000, 0.1);
    lastT = now;

    var raw = (now - t0)/DUR;
    var p = clamp01(raw);            // constant speed: linear, never accelerates
    if (reduced) p = 0.55;

    /* ---- gate state, shared by everything below ---- */
    var sc   = kf(p, SC);
    var sxv  = kf(p, SX);
    var lit  = sstep(ramp(p, .15, .40));
    var lens = sstep(ramp(p, .22, .62)) * (1 - ramp(p, .978, .998));
    var feedsOn = sstep(ramp(p, .50, .58));
    var entry = sstep(ramp(p, .955, .99));      // the crossing
    var rot  = -22 * (1 - sstep(ramp(p, .06, .44)));

    /* ---- parallax: every layer scales about the vanishing point.
           The deep background recedes hard — near the horizon, space
           itself goes dark and the gate owns the frame ---- */
    var bgDim = 1 - .62 * sstep(ramp(p, .24, .76));
    for (var i = 0; i < layers.length; i++){
      layers[i].el.style.transform = 'scale(' + (1 + p * layers[i].f) + ')';
      layers[i].el.style.opacity = bgDim.toFixed(3);
    }

    /* ---- gate transform ---- */
    sph.style.opacity = ramp(p, .015, .10);
    sph.style.transform = 'translate(-50%,-50%) translate(' + sxv.toFixed(3) + 'vw,0) scale(' + sc.toFixed(4) + ')';
    bhAll.setAttribute('transform', 'rotate(' + rot.toFixed(2) + ')');

    /* ---- structure lighting, ring by ring ---- */
    glint.setAttribute('opacity', (sstep(ramp(p, .05, .12)) * (1 - sstep(ramp(p, .17, .24))) * .5).toFixed(3));
    farMach.setAttribute('opacity', (sstep(ramp(p, .18, .27)) * .9).toFixed(3));
    ringOuter.setAttribute('opacity', sstep(ramp(p, .16, .25)).toFixed(3));
    ringMid.setAttribute('opacity', sstep(ramp(p, .21, .30)).toFixed(3));
    ringInner.setAttribute('opacity', sstep(ramp(p, .27, .36)).toFixed(3));
    pylons.setAttribute('opacity', sstep(ramp(p, .30, .40)).toFixed(3));
    tiltBack.setAttribute('opacity', (lit * .5).toFixed(3));
    tiltFront.setAttribute('opacity', lit.toFixed(3));
    for (i = 0; i < 4; i++) beams[i].setAttribute('opacity', ramp(p, BEAM_AT[i], BEAM_AT[i] + .04).toFixed(3));
    feeds.setAttribute('opacity', (feedsOn * .9).toFixed(3));
    jets.setAttribute('opacity', (sstep(ramp(p, .56, .64)) * (.55 + .2 * Math.sin(now * .0011))).toFixed(3));

    /* ---- the horizon: photon ring brightens as we close, breathing slightly ---- */
    var ph1 = lit * (.45 + .55 * lens) * (.88 + .12 * Math.sin(now * .0023));
    photon.setAttribute('opacity', ph1.toFixed(3));
    photon2.setAttribute('opacity', (ph1 * .75).toFixed(3));
    photon3.setAttribute('opacity', (lens * .8).toFixed(3));
    einstein.setAttribute('opacity', (lens * .85).toFixed(3));
    var dop = lit * (.2 + .8 * lens);
    dopBack.setAttribute('opacity', (dop * .95).toFixed(3));
    dopFront.setAttribute('opacity', dop.toFixed(3));
    knotG.setAttribute('opacity', (dop * .9).toFixed(3));

    skyGlow.style.opacity = feedsOn * .5;
    skyTear.style.opacity = lens * .5 + entry * .45;

    /* ---- the crossing: one clean ring, one flash, then the far side ---- */
    if (entry > 0 && entry < 1){
      pulseRing.style.opacity = (1 - entry) * .8;
      pulseRing.style.transform = 'translate(-50%,-50%) scale(' + (.3 + 2.4 * entry).toFixed(3) + ')';
    } else pulseRing.style.opacity = 0;
    pulseFlash.style.opacity = ramp(p, .972, .984) * (1 - ramp(p, .986, 1)) * .9;

    /* ---- debris ---- */
    debris.style.opacity = ramp(p, .57, .67) * (1 - ramp(p, .96, .99));

    /* ---- the migration fleet ---- */
    fleetCx.clearRect(0, 0, W, H);
    var fleetA = ramp(p, .44, .52) * (1 - ramp(p, .905, .93));
    if (fleetA > 0.004){
      var gx = W * GATE.x, gy = H * GATE.y, i3, sp2;
      for (i3 = 0; i3 < FLEET.length; i3++){
        sp2 = FLEET[i3];
        sp2.w = (sp2.ph + p * sp2.spd) % 1;
      }
      FLEET.sort(function(a, b){ return b.w - a.w; });   // far first, near last
      for (i3 = 0; i3 < FLEET.length; i3++){
        sp2 = FLEET[i3];
        var q = 1 / (1 + sp2.w * ZSPAN);
        var sx2 = gx + sp2.ox * W/100 * q;
        var sy2 = gy + sp2.oy * H/100 * q;
        var Lpx = sp2.L * W/100 * q;
        if (Lpx < .45) continue;
        var aSh = fleetA * (1 - ramp(sp2.w, .90, .99)) * (.62 + .38*q);
        if (aSh < .01) continue;
        if (sx2 < -Lpx || sx2 > W + Lpx || sy2 < -Lpx || sy2 > H + Lpx) continue;
        // tidal read: vessels near the horizon smear tangentially with the light
        var lk = lens * ramp(sp2.w, .70, .96) * .55;
        drawShip(fleetCx, sp2, sx2, sy2, Math.atan2(gy - sy2, gx - sx2), Lpx, aSh, now, lk);
      }
    }

    /* ---- captions ---- */
    var want = -1, k;
    for (k = 0; k < CAPS.length; k++) if (p >= CAPS[k].a && p <= CAPS[k].b) { want = k; break; }
    if (want !== curCap){
      curCap = want;
      if (want >= 0){ capSm.textContent = CAPS[want].k; mountCap(CAPS[want], now); }
    }
    if (want >= 0){
      var c = CAPS[want];
      revealCap(c, now);
      capEl.style.opacity = (ramp(p, c.a, c.a + 0.02) * (1 - ramp(p, c.b - 0.02, c.b)) * 0.92);
    } else capEl.style.opacity = 0;

    /* ---- stars: forward streaming, occlusion, lensing ---- */
    var cxs = W * (0.5 + sxv / 100), cys = H * 0.46;
    var rPx = 1.50 * vmin * 0.1389 * sc * ramp(p, .015, .10);
    starCx.clearRect(0,0,W,H);
    for (i = 0; i < starList.length; i++){
      var st = starList[i];
      if (!reduced){
        st.d *= 1 + 0.026 * st.z * dt;
        if (st.d > 1.18){ st.d = 0.04 + Math.random()*0.25; st.a = Math.random()*6.2832; }
      }
      var x2 = cxs + Math.cos(st.a) * st.d * maxR;
      var y2 = cys + Math.sin(st.a) * st.d * maxR;
      var dxs = x2 - cxs, dys = y2 - cys, ds = st.d * maxR;
      if (ds < rPx * 1.01) continue;                       // inside the horizon
      var tw = 0.55 + 0.45*Math.sin(now/1000*st.tw + st.ph);
      var a = tw * clamp01(st.d * 6) * (.55 + .45*bgDim);
      if (a < 0.02) continue;
      var col = st.warm ? '#f6e0c8' : '#dfe9ff';
      var lt = 0;
      if (lens > 0 && ds < rPx * 3.8 && rPx > 4){
        lt = clamp01(1 - (ds - rPx) / (rPx * 2.6));
        var push = lens * lt * rPx * 0.24;
        x2 += dxs/ds * push; y2 += dys/ds * push;
      }
      var len = lens * lt * lt * rPx * 0.9;
      starCx.globalAlpha = a;
      if (len > 1.5){
        var tx = -dys/ds, ty = dxs/ds;
        starCx.strokeStyle = col;
        starCx.lineWidth = st.r * 1.5;
        starCx.beginPath();
        starCx.moveTo(x2 - tx*len/2, y2 - ty*len/2);
        starCx.lineTo(x2 + tx*len/2, y2 + ty*len/2);
        starCx.stroke();
      } else {
        starCx.fillStyle = col;
        starCx.beginPath();
        starCx.arc(x2, y2, st.r, 0, 6.2832);
        starCx.fill();
      }
    }
    starCx.globalAlpha = 1;

    /* ---- the end: light gone, drift into black ---- */
    if (!reduced && p > .985 && !endFading){
      endFading = true;
      fader.style.transition = 'opacity 3s ease';
      fader.style.opacity = 1;
    }
    if (raw >= 1.04 && !done){ done = true; replayBtn.classList.add('on'); }

    requestAnimationFrame(frame);
  }

  replayBtn.addEventListener('click', function(){
    done = false; endFading = false; curCap = -1; seek = NaN;
    replayBtn.classList.remove('on');
    fader.style.transition = 'opacity .6s ease';
    fader.style.opacity = 1;
    setTimeout(function(){
      t0 = null;
      fader.style.transition = 'opacity 2.8s ease';
      fader.style.opacity = 0;
    }, 700);
  });

  // fade up from black and begin the shot
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ fader.style.opacity = 0; });
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
