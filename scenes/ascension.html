<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Stellar Foundry — Ascension</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap');

/* ============================================================
   ASCENSION — a single-shot cinematic 2.5D parallax environment.
   One continuous ~100s forward pan through deep space, at a
   constant speed that never changes: harvested-star lattice →
   the Dyson Sphere resolves → iris opens, conduits ignite →
   gravitational lensing → the migration fleet passes through
   the tear → the sphere folds shut and the light goes out.
   All art is hand-placed SVG; motion is many small independent
   loops. No cuts, no shakes, no zooms — depth comes from layers
   scaling at different rates around a fixed vanishing point.
   Debug: open with #p=0.63 in the URL to seek to that progress.
   ============================================================ */

:root{
  --ink:#0b0d1f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#04050d;font-family:"Chakra Petch","Bank Gothic",Eurostile,"Segoe UI",Arial,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;transform:translateZ(0)}

/* ---------- sky ---------- */
.sky{position:absolute;inset:0;pointer-events:none}
#sky-space{background:linear-gradient(#03040b 0%,#0a0d22 58%,#101430 100%)}
#sky-coreglow{background:radial-gradient(62vmin at 50% 46%,rgba(255,196,120,.20),rgba(255,180,100,.05) 55%,rgba(255,180,100,0) 75%);opacity:0}
#sky-tearglow{background:radial-gradient(40vmin at 50% 46%,rgba(190,220,255,.22),rgba(160,190,255,.04) 50%,rgba(160,190,255,0) 72%);opacity:0}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:1}

/* ---------- parallax layers (forward pan = scale about the vanishing point) ---------- */
.layer{position:absolute;inset:0;will-change:transform;pointer-events:none;transform-origin:50% 46%}
.piece{position:absolute;left:0;top:0;width:100%;height:100%}
.piece svg{display:block;width:100%;height:100%}

#layer-nebula{z-index:2}
#layer-galaxies{z-index:3}
#layer-latfar{z-index:4}
#layer-latnear{z-index:5}

/* ---------- nebulae: cold cosmic dust, nearly static ---------- */
.neb{position:absolute;border-radius:50%;filter:blur(30px)}
.neb.a{top:6vh;left:8vw;width:48vw;height:36vh;
  background:radial-gradient(closest-side,rgba(118,82,196,.20),rgba(118,82,196,0) 70%)}
.neb.b{top:40vh;left:56vw;width:42vw;height:32vh;
  background:radial-gradient(closest-side,rgba(62,112,200,.18),rgba(62,112,200,0) 70%)}
.neb.c{top:66vh;left:6vw;width:30vw;height:24vh;
  background:radial-gradient(closest-side,rgba(196,108,168,.10),rgba(196,108,168,0) 70%)}

/* ---------- generic ambient motion ---------- */
@keyframes driftR{from{transform:translate3d(-1.6vw,0,0)}to{transform:translate3d(1.6vw,0,0)}}
@keyframes driftL{from{transform:translate3d(1.3vw,0,0)}to{transform:translate3d(-1.3vw,0,0)}}
@keyframes bob{from{transform:translate3d(0,-.4vh,0)}to{transform:translate3d(0,.4vh,0)}}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes blink{0%,92%,100%{opacity:0}94%,97%{opacity:1}}
@keyframes blink2{0%,88%,100%{opacity:.1}90%,94%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-504}}
@keyframes streamFlow{to{stroke-dashoffset:-1131}}
@keyframes latFlow{to{stroke-dashoffset:-310}}
@keyframes latFlow2{to{stroke-dashoffset:-324}}
@keyframes ringFlow{to{stroke-dashoffset:-396}}
@keyframes ringFlowA{to{stroke-dashoffset:-370}}
@keyframes ringFlowB{to{stroke-dashoffset:384}}
@keyframes gxSpin{to{transform:rotate(360deg)}}
@keyframes flameFlick{from{transform:scaleX(.9) scaleY(.96)}to{transform:scaleX(1.08) scaleY(1.04)}}
@keyframes shardL{from{transform:translate3d(112vw,0,0) rotate(0deg)}to{transform:translate3d(-18vw,4vh,0) rotate(-320deg)}}
@keyframes shardR{from{transform:translate3d(-16vw,0,0) rotate(0deg)}to{transform:translate3d(114vw,-5vh,0) rotate(280deg)}}

.drift-r{animation:driftR 260s ease-in-out infinite alternate}
.drift-l{animation:driftL 220s ease-in-out infinite alternate}

/* ---------- lattice (harvested stars + energy streams, JS-generated) ---------- */
.st{stroke:#bcd7f6;fill:none;stroke-linecap:round;animation:latFlow 7s linear infinite}
.st2{stroke:#cfe3ff;fill:none;stroke-linecap:round;animation:latFlow2 6s linear infinite}

/* ---------- the sphere (scripted, not a generic layer) ---------- */
#sphere{position:absolute;left:50%;top:46%;width:130vmin;height:130vmin;z-index:8;
  pointer-events:none;will-change:transform,opacity}
#sphere svg{display:block;width:100%;height:100%;overflow:visible}

/* ---------- pulse ring + flashes ---------- */
#pulsering{position:absolute;left:50%;top:46%;width:100vmin;height:100vmin;z-index:9;opacity:0;
  border-radius:50%;border:2px solid rgba(223,236,255,.9);pointer-events:none;will-change:transform,opacity;
  box-shadow:0 0 46px rgba(159,220,255,.55),inset 0 0 46px rgba(159,220,255,.35)}
#pulseflash{position:absolute;inset:0;z-index:28;opacity:0;pointer-events:none;background:#eaf4ff}
#gulp{position:absolute;left:50vw;top:46vh;width:34px;height:34px;z-index:25;opacity:0;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,#ffffff,rgba(191,238,255,.6) 45%,rgba(159,232,255,0) 72%)}

/* ---------- foreground debris (fastest depth layer) ---------- */
#debris{position:absolute;inset:0;z-index:18;opacity:0;pointer-events:none}
.shard{position:absolute;left:0;will-change:transform}
.shard svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- migration lanes + fleet ---------- */
#migstream{position:absolute;inset:0;z-index:20;opacity:0;pointer-events:none}
#migstream svg{width:100%;height:100%}
#migstream path{stroke:#dfe9ff;stroke-width:2.2;fill:none;stroke-dasharray:3 26;
  animation:streamFlow 10s linear infinite;opacity:.75}
#fleet{position:absolute;inset:0;z-index:22;pointer-events:none}
.mig{position:absolute;left:0;top:0;will-change:transform,opacity;opacity:0}
.mig svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- cinema chrome ---------- */
#vignette{position:absolute;inset:0;z-index:30;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 46%,rgba(0,0,0,0) 58%,rgba(3,4,12,.46) 100%)}
.bar{position:absolute;left:0;width:100%;height:5.5vh;background:#020308;z-index:31}
#bar-t{top:0}#bar-b{bottom:0}

#caption{position:absolute;left:0;bottom:5.5vh;z-index:32;width:min(74vw,92ch);
  color:#e6eef8;font-size:clamp(13px,1.4vw,19px);line-height:1.62;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;opacity:0;
  padding:1.4em 1.9em 1.5em 5.4vw;
  background:linear-gradient(103deg,rgba(5,8,16,.78),rgba(5,8,16,.55) 58%,rgba(5,8,16,0));
  border-top:1px solid rgba(150,190,230,.30);border-right:1px solid rgba(150,190,230,.16);
  border-top-right-radius:2px;
  text-shadow:-1px -1px 0 #0a0c14,1px -1px 0 #0a0c14,-1px 1px 0 #0a0c14,1px 1px 0 #0a0c14,0 2px 3px rgba(3,5,10,.9),0 1px 12px rgba(4,8,20,.8)}
#caption::before{content:"";position:absolute;top:-1px;right:-1px;width:15px;height:15px;
  border-top:2px solid rgba(184,214,242,.72);border-right:2px solid rgba(184,214,242,.72);border-top-right-radius:2px}
#caption small{display:block;letter-spacing:.34em;font-weight:500;font-size:.72em;color:#8fb4d8;margin-bottom:.75em}
#caption .ln{display:block;opacity:0;transform:translateY(5px);
  transition:opacity .55s ease,transform .55s ease;margin-bottom:.46em}
#caption .ln.on{opacity:1;transform:none}
#caption .ln.vis{opacity:1;transform:none;transition:none}
#caption .ln.open{color:#fbfdff;font-weight:700}
#caption .ln.verdict{color:#ffb488}
#caption .wd{white-space:nowrap}
#caption .ch{opacity:0;transition:opacity .1s linear}
#caption .ch.on{opacity:1}
#caption .redact{display:inline-block;width:8ch;height:.72em;background:#e6eef8;border-radius:1px;
  transform:translateY(.06em);box-shadow:-1px -1px 0 #0a0c14,1px -1px 0 #0a0c14,-1px 1px 0 #0a0c14,1px 1px 0 #0a0c14}
#caption .cur{display:inline-block;width:.5ch;height:.82em;background:#e6eef8;margin-left:1px;border-radius:1px;
  transform:translateY(.1em);animation:curBlink 1.05s ease-in-out infinite;
  box-shadow:-1px -1px 0 #0a0c14,1px -1px 0 #0a0c14,-1px 1px 0 #0a0c14,1px 1px 0 #0a0c14}
@keyframes curBlink{0%,100%{opacity:1}50%{opacity:.03}}

#fader{position:absolute;inset:0;background:#020308;z-index:40;pointer-events:none;transition:opacity 2.8s ease;opacity:1}
#replay{position:absolute;right:5vw;bottom:8.5vh;z-index:45;opacity:0;pointer-events:none;
  transition:opacity 2s ease;background:none;border:1px solid rgba(190,215,240,.45);
  color:#d5e4f4;font:inherit;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  padding:.55em 1.2em;cursor:pointer;border-radius:2px}
#replay.on{opacity:.85;pointer-events:auto}
#replay:hover{background:rgba(190,215,240,.12)}

.reduced .layer,.reduced svg *,.reduced .shard,.reduced .st,.reduced .st2,.reduced #migstream path{animation:none!important}
</style>
</head>
<body>
<div id="stage">

  <div class="sky" id="sky-space"></div>
  <div class="sky" id="sky-coreglow"></div>
  <div class="sky" id="sky-tearglow"></div>

  <canvas id="stars"></canvas>

  <!-- =================== NEBULAE (f .02 — almost static) =================== -->
  <div class="layer" data-f="0.02" id="layer-nebula">
    <div class="piece">
      <div class="neb a drift-r"></div>
      <div class="neb b drift-l"></div>
      <div class="neb c drift-r"></div>
    </div>
  </div>

  <!-- =================== DISTANT GALAXIES (f .015) =================== -->
  <div class="layer" data-f="0.015" id="layer-galaxies">
    <div class="piece">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <g style="animation:shimmer 26s ease-in-out infinite">
          <ellipse cx="310" cy="200" rx="46" ry="14" fill="rgba(168,184,255,.14)" transform="rotate(-24 310 200)"/>
          <ellipse cx="310" cy="200" rx="20" ry="6" fill="rgba(224,230,255,.20)" transform="rotate(-24 310 200)"/>
        </g>
        <g style="animation:shimmer 34s ease-in-out infinite 8s">
          <ellipse cx="1560" cy="150" rx="38" ry="11" fill="rgba(200,178,255,.12)" transform="rotate(18 1560 150)"/>
          <ellipse cx="1560" cy="150" rx="15" ry="5" fill="rgba(238,230,255,.18)" transform="rotate(18 1560 150)"/>
        </g>
        <g style="animation:shimmer 30s ease-in-out infinite 4s">
          <ellipse cx="1710" cy="760" rx="52" ry="15" fill="rgba(150,190,255,.11)" transform="rotate(-40 1710 760)"/>
          <ellipse cx="1710" cy="760" rx="22" ry="7" fill="rgba(220,236,255,.16)" transform="rotate(-40 1710 760)"/>
        </g>
        <g style="animation:shimmer 40s ease-in-out infinite 14s">
          <ellipse cx="210" cy="840" rx="34" ry="10" fill="rgba(190,170,255,.10)" transform="rotate(30 210 840)"/>
        </g>
        <circle cx="980" cy="120" r="2.2" fill="rgba(214,226,255,.5)" style="animation:shimmer 18s ease-in-out infinite"/>
      </svg>
    </div>
  </div>

  <!-- =================== HARVESTED-STAR LATTICE, FAR (f .10) =================== -->
  <div class="layer" data-f="0.10" id="layer-latfar">
    <div class="piece">
      <svg id="latFar" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
    </div>
  </div>

  <!-- =================== HARVESTED-STAR LATTICE, NEAR (f .30) =================== -->
  <div class="layer" data-f="0.30" id="layer-latnear">
    <div class="piece">
      <svg id="latNear" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
    </div>
  </div>

  <!-- =================== THE DYSON SPHERE (scripted depth layer) =================== -->
  <div id="sphere">
    <svg viewBox="-540 -540 1080 1080">
      <defs>
        <radialGradient id="gBase" cx="38%" cy="34%" r="82%">
          <stop offset="0" stop-color="#2b3358"/>
          <stop offset=".45" stop-color="#1c2444"/>
          <stop offset=".78" stop-color="#131a34"/>
          <stop offset="1" stop-color="#0c1128"/>
        </radialGradient>
        <radialGradient id="gLimb">
          <stop offset="0" stop-color="rgba(4,6,16,0)"/>
          <stop offset=".72" stop-color="rgba(4,6,16,0)"/>
          <stop offset="1" stop-color="rgba(4,6,16,.78)"/>
        </radialGradient>
        <radialGradient id="gCore">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".18" stop-color="#fff3da"/>
          <stop offset=".45" stop-color="#ffd27a"/>
          <stop offset=".75" stop-color="rgba(255,150,70,.5)"/>
          <stop offset="1" stop-color="rgba(255,120,50,0)"/>
        </radialGradient>
        <radialGradient id="gSpill">
          <stop offset="0" stop-color="rgba(255,205,130,.42)"/>
          <stop offset=".6" stop-color="rgba(255,190,110,.12)"/>
          <stop offset="1" stop-color="rgba(255,190,110,0)"/>
        </radialGradient>
        <radialGradient id="gGx">
          <stop offset="0" stop-color="#fff6e6"/>
          <stop offset=".3" stop-color="rgba(255,228,190,.75)"/>
          <stop offset="1" stop-color="rgba(200,180,255,0)"/>
        </radialGradient>
        <clipPath id="apClip"><circle r="172"/></clipPath>
        <clipPath id="tearClip"><circle id="tearC" r="0"/></clipPath>
      </defs>

      <g id="sphAll">

        <!-- back half of the great tilted transit ring -->
        <g id="tiltBack" opacity=".55">
          <g transform="rotate(-16)">
            <path d="M-505 0 A505 118 0 0 1 505 0" fill="none" stroke="#232b4e" stroke-width="26"/>
            <path d="M-505 0 A505 118 0 0 1 505 0" fill="none" stroke="#5d6d9e" stroke-width="3"
              stroke-dasharray="36 30" style="animation:ringFlow 26s linear infinite"/>
          </g>
        </g>

        <!-- ===== the shell ===== -->
        <g id="shell">
          <circle r="380" fill="url(#gBase)"/>

          <!-- mechanical panel bands: overlapping plates at close values -->
          <g id="panels" opacity="0">
            <circle r="270" fill="none" stroke="#1d2445" stroke-width="90"
              stroke-dasharray="150 24 210 32 120 28" transform="rotate(8)"/>
            <circle r="330" fill="none" stroke="#202a4e" stroke-width="46"
              stroke-dasharray="220 30 160 26" transform="rotate(-14)"/>
            <!-- articulated sections, sliding across one another -->
            <g><circle r="300" fill="none" stroke="#283258" stroke-width="26" stroke-dasharray="90 18">
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="240s" repeatCount="indefinite"/>
            </circle></g>
            <g><circle r="246" fill="none" stroke="#2c3560" stroke-width="20" stroke-dasharray="60 22">
              <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="170s" repeatCount="indefinite"/>
            </circle></g>
            <g><circle r="352" fill="none" stroke="#232c50" stroke-width="14" stroke-dasharray="130 40">
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="300s" repeatCount="indefinite"/>
            </circle></g>
            <!-- seams + longitude lines: the curvature read -->
            <circle r="225" fill="none" stroke="#3a4570" stroke-width="1.5" opacity=".5"/>
            <circle r="315" fill="none" stroke="#3a4570" stroke-width="1.5" opacity=".5"/>
            <circle r="352" fill="none" stroke="#3a4570" stroke-width="1.2" opacity=".4"/>
            <ellipse rx="120" ry="372" fill="none" stroke="#3a4570" stroke-width="1.2" opacity=".35"/>
            <ellipse rx="250" ry="376" fill="none" stroke="#3a4570" stroke-width="1.2" opacity=".3"/>

            <!-- section lights: districts of the machine, lit in sequence -->
            <g id="lt1" opacity="0" fill="#bfeeff">
              <rect x="196" y="-236" width="7" height="4"/><rect x="216" y="-218" width="5" height="4"/>
              <rect x="236" y="-190" width="8" height="4" fill="#ffe9b8"/><rect x="182" y="-256" width="4" height="4"/>
              <rect x="258" y="-160" width="6" height="4"/><circle cx="230" cy="-244" r="2.4" style="animation:blink2 6s linear infinite"/>
            </g>
            <g id="lt2" opacity="0" fill="#bfeeff">
              <rect x="222" y="168" width="7" height="4"/><rect x="196" y="200" width="6" height="4" fill="#ffe9b8"/>
              <rect x="252" y="140" width="5" height="4"/><rect x="176" y="230" width="8" height="4"/>
              <circle cx="246" cy="196" r="2.4" style="animation:blink2 7s linear infinite 2s"/>
            </g>
            <g id="lt3" opacity="0" fill="#bfeeff">
              <rect x="-230" y="176" width="7" height="4"/><rect x="-204" y="206" width="5" height="4"/>
              <rect x="-256" y="146" width="8" height="4" fill="#ffe9b8"/><rect x="-186" y="236" width="5" height="4"/>
              <circle cx="-238" cy="212" r="2.4" style="animation:blink2 5.5s linear infinite 1s"/>
            </g>
            <g id="lt4" opacity="0" fill="#bfeeff">
              <rect x="-212" y="-208" width="7" height="4"/><rect x="-238" y="-178" width="5" height="4" fill="#ffe9b8"/>
              <rect x="-188" y="-238" width="6" height="4"/><rect x="-262" y="-148" width="8" height="4"/>
              <circle cx="-224" cy="-186" r="2.4" style="animation:blink2 8s linear infinite 3s"/>
            </g>

            <!-- energy conduits: stellar output moving across the surface -->
            <g id="cd1" opacity="0">
              <path d="M150 -155 Q235 -215 300 -222" fill="none" stroke="#5fb8e8" stroke-width="7" opacity=".25"/>
              <path d="M150 -155 Q235 -215 300 -222" fill="none" stroke="#9fe8ff" stroke-width="3"
                stroke-dasharray="14 22" style="animation:flow 3.2s linear infinite"/>
              <path d="M185 -110 Q270 -150 345 -140" fill="none" stroke="#5fb8e8" stroke-width="6" opacity=".22"/>
              <path d="M185 -110 Q270 -150 345 -140" fill="none" stroke="#9fe8ff" stroke-width="2.6"
                stroke-dasharray="14 22" style="animation:flow 3.6s linear infinite .6s"/>
              <path d="M110 -190 Q160 -290 205 -310" fill="none" stroke="#9fe8ff" stroke-width="2.6"
                stroke-dasharray="14 22" style="animation:flow 3s linear infinite 1.1s"/>
            </g>
            <g id="cd2" opacity="0">
              <path d="M150 155 Q235 215 300 222" fill="none" stroke="#5fb8e8" stroke-width="7" opacity=".25"/>
              <path d="M150 155 Q235 215 300 222" fill="none" stroke="#9fe8ff" stroke-width="3"
                stroke-dasharray="14 22" style="animation:flow 3.4s linear infinite .3s"/>
              <path d="M110 190 Q160 290 205 310" fill="none" stroke="#9fe8ff" stroke-width="2.6"
                stroke-dasharray="14 22" style="animation:flow 3.1s linear infinite 1.4s"/>
            </g>
            <g id="cd3" opacity="0">
              <path d="M-150 155 Q-235 215 -300 222" fill="none" stroke="#5fb8e8" stroke-width="7" opacity=".25"/>
              <path d="M-150 155 Q-235 215 -300 222" fill="none" stroke="#9fe8ff" stroke-width="3"
                stroke-dasharray="14 22" style="animation:flow 3.5s linear infinite .8s"/>
              <path d="M-185 110 Q-270 150 -345 140" fill="none" stroke="#9fe8ff" stroke-width="2.6"
                stroke-dasharray="14 22" style="animation:flow 3.2s linear infinite .2s"/>
            </g>
            <g id="cd4" opacity="0">
              <path d="M-150 -155 Q-235 -215 -300 -222" fill="none" stroke="#5fb8e8" stroke-width="7" opacity=".25"/>
              <path d="M-150 -155 Q-235 -215 -300 -222" fill="none" stroke="#9fe8ff" stroke-width="3"
                stroke-dasharray="14 22" style="animation:flow 3.3s linear infinite 1s"/>
              <path d="M-110 -190 Q-160 -290 -205 -310" fill="none" stroke="#9fe8ff" stroke-width="2.6"
                stroke-dasharray="14 22" style="animation:flow 3.7s linear infinite 1.7s"/>
            </g>

            <!-- secondary apertures, opening with the iris -->
            <g id="miniAp1" transform="translate(250,-118)">
              <circle r="30" fill="#1c2342" stroke="#3a4570" stroke-width="3"/>
              <circle id="miniA" r="0" fill="url(#gCore)"/>
            </g>
            <g id="miniAp2" transform="translate(-262,132)">
              <circle r="26" fill="#1c2342" stroke="#3a4570" stroke-width="3"/>
              <circle id="miniB" r="0" fill="url(#gCore)"/>
            </g>
          </g>

          <!-- warm light spilling from the open core across the panels -->
          <circle id="spill" r="380" fill="url(#gSpill)" opacity="0"/>
          <!-- limb shading: the sphere read -->
          <circle r="380" fill="url(#gLimb)"/>
          <!-- rim light, upper right -->
          <path id="rimHi" d="M96 -358 A371 371 0 0 1 355 -108" fill="none" stroke="#8fa2d6" stroke-width="2.5" opacity="0"/>
        </g>

        <!-- ===== central aperture assembly ===== -->
        <g id="apGrp">
          <g clip-path="url(#apClip)">
            <!-- the star inside -->
            <g id="coreGrp">
              <circle r="150" fill="url(#gCore)"/>
              <circle r="84" fill="#fff3da" opacity=".9"/>
              <circle r="44" fill="#ffffff"/>
              <circle id="coreHot" r="150" fill="url(#gCore)" opacity=".5"/>
            </g>
            <!-- the galaxy beyond the tear -->
            <g id="tearG" clip-path="url(#tearClip)">
              <circle r="170" fill="#05030e"/>
              <g style="animation:gxSpin 420s linear infinite">
                <ellipse rx="112" ry="40" fill="rgba(120,160,255,.13)" transform="rotate(-10)"/>
                <ellipse rx="95" ry="33" fill="rgba(159,180,255,.20)" transform="rotate(24)"/>
                <ellipse rx="68" ry="22" fill="rgba(214,190,255,.28)" transform="rotate(58)"/>
                <circle r="40" fill="url(#gGx)"/>
                <circle r="16" fill="#fff6e6"/>
                <g fill="#dfe9ff">
                  <circle cx="-84" cy="26" r="1.6"/><circle cx="62" cy="-48" r="1.3"/>
                  <circle cx="104" cy="14" r="1.2"/><circle cx="-46" cy="-70" r="1.4"/>
                  <circle cx="24" cy="78" r="1.2"/><circle cx="-116" cy="-18" r="1.1"/>

<script>
(function(){
  "use strict";

  /* ============ the single shot ============ */
  var DUR = 100000;    // ~100s forward pan, constant speed
  var stage = document.getElementById('stage');
  var layers = [].slice.call(document.querySelectorAll('.layer')).map(function(el){
    return { el: el, f: parseFloat(el.getAttribute('data-f')) };
  });

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) document.body.classList.add('reduced');

  function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ramp(p, a, b){ return clamp01((p - a) / (b - a)); }
  function sstep(t){ return t*t*(3-2*t); }
  // piecewise-linear keyframe track: kf(p, [[p0,v0],[p1,v1],...])
  function kf(p, pts){
    for (var i = 1; i < pts.length; i++){
      if (p <= pts[i][0]){
        var a = pts[i-1], b = pts[i];
        var u = clamp01((p - a[0]) / (b[0] - a[0]));
        return a[1] + (b[1] - a[1]) * u;
      }
    }
    return pts[pts.length - 1][1];
  }
  function el(id){ return document.getElementById(id); }

  /* ============ scripted elements ============ */
  var sph        = el('sphere');
  var sphAll     = el('sphAll');
  var panels     = el('panels');
  var housing    = el('housing');
  var rimHi      = el('rimHi');
  var spill      = el('spill');
  var silCover   = el('silCover');
  var coreGrp    = el('coreGrp');
  var coreHot    = el('coreHot');
  var tearC      = el('tearC');
  var tearRim    = el('tearRim');
  var tearG      = el('tearG');
  var petalEls   = [].slice.call(document.querySelectorAll('#petals .pt'));
  var cds        = [el('cd1'), el('cd2'), el('cd3'), el('cd4')];
  var lts        = [el('lt1'), el('lt2'), el('lt3'), el('lt4')];
  var miniA      = el('miniA'), miniB = el('miniB');
  var tiltBack   = el('tiltBack'), tiltFront = el('tiltFront'), freeRings = el('freeRings');
  var lensHalo   = el('lensHalo');
  var escort     = el('escort');
  var skyGlow    = el('sky-coreglow');
  var skyTear    = el('sky-tearglow');
  var pulseRing  = el('pulsering');
  var pulseFlash = el('pulseflash');
  var debris     = el('debris');
  var migStream  = el('migstream');
  var gulp       = el('gulp');

  /* ============ timeline (all in shot progress p) ============ */
  var SC  = [[0,.040],[.15,.078],[.40,.30],[.60,.52],[.80,.72],[.95,.80],[1,.805]];  // sphere scale
  var SX  = [[0,3.6],[.42,0],[1,0]];                                                // sphere x drift, vw
  var CD_AT = [.46,.50,.54,.58];                                                    // conduit ignition

  /* ============ captions — fleet log, same voice as the landing reports ============ */
  var capEl = el('caption');
  var capSm = capEl.querySelector('small');
  var capTx = capEl.querySelector('span');
  var CAPS = [
    { a:.02, b:.145, k:'Exodus Fleet — Ascension 01-0',
      t:'Long-range survey counted four hundred harvested stars along the transit corridor. Each one dimmed, each one ringed, each one still feeding the relay lattice. The energy travels ahead of us. Every reading terminates at the same coordinates.' },
    { a:.185, b:.37, k:'Exodus Fleet — Ascension 02-0',
      t:'The silhouette resolved at one-third light-hour: a complete engineered shell, enclosing star \x01. Scale estimates were revised four times during approach. The fleet has stopped transmitting scale estimates.' },
    { a:.42, b:.585, k:'Exodus Fleet — Ascension 03-2',
      t:'The sphere registered our approach. Apertures opened in sequence along the near meridian, and stored stellar output began moving through surface conduits older than recorded history. No hail was received. None appears to be required.' },
    { a:.615, b:.755, k:'Exodus Fleet — Ascension 04-0',
      t:'Core output is still climbing. The background constellations have begun to bend around the shell, and navigation no longer agrees with observation... The builders did not harvest four hundred stars for power. They harvested them for an exit.' },
    { a:.775, b:.995, k:'Exodus Fleet — Ascension 05-0', cps:14, fin:true,
      t:'The aperture opened onto stars that appear on no chart.\nThe fleet crossed in formation. No vessel slowed. No vessel returned.\nThe sphere folded its light away behind them.\nNo further entries appear in this log.' }
  ];
  var curCap = -1;

  // report reveal: sentence-by-sentence fade for logs, slow typewriter for the last
  var capT0 = 0;
  function parseCap(c){
    if (c.segs) return;
    var hard = c.t.split('\n'), segs = [], h, parts, pj, txt, first = true;
    for (h = 0; h < hard.length; h++){
      parts = hard[h].split(/(?<=[a-z0-9])\.\s+/);
      for (pj = 0; pj < parts.length; pj++){
        txt = parts[pj].trim();
        if (!txt) continue;
        if (pj < parts.length - 1) txt += '.';
        var raw = txt.split('\x01'), tk = [], ti;
        for (ti = 0; ti < raw.length; ti++){
          if (ti > 0) tk.push({ r: 1 });
          if (raw[ti].length) tk.push(raw[ti]);
        }
        var low = txt.toLowerCase();
        segs.push({ tk: tk, cls: first ? 'open' : (low.indexOf('no further') >= 0 ? 'verdict' : '') });
        first = false;
      }
    }
    c.segs = segs;
  }
  function esc(s){ return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function mountCap(c, nowT){
    parseCap(c); capT0 = nowT;
    var html = '', i, j, w, ch, seg, tk, words;
    for (i = 0; i < c.segs.length; i++){
      seg = c.segs[i];
      html += '<span class="ln ' + (c.fin ? 'vis ' : '') + seg.cls + '">';
      for (j = 0; j < seg.tk.length; j++){
        tk = seg.tk[j];
        if (tk.r){ html += '<span class="redact ch"></span>'; }
        else if (c.fin){
          words = tk.split(' ');
          for (w = 0; w < words.length; w++){
            if (w > 0) html += '<span class="ch"> </span>';
            html += '<span class="wd">';
            for (ch = 0; ch < words[w].length; ch++) html += '<span class="ch">' + esc(words[w][ch]) + '</span>';
            html += '</span>';
          }
        } else html += esc(tk);
      }
      html += '</span>';
    }
    if (c.fin) html += '<span class="cur"></span>';
    capTx.innerHTML = html;
    c._lns = capTx.querySelectorAll('.ln');
    c._chs = c.fin ? capTx.querySelectorAll('.ch') : null;
    c._cur = c.fin ? capTx.querySelector('.cur') : null;
    c._shown = -1;
  }
  function revealCap(c, nowT){
    var elp = (nowT - capT0) / 1000;
    if (c.fin){
      var n = Math.floor(Math.max(0, elp - 0.2) * (c.cps || 12)), i;
      if (n > c._chs.length) n = c._chs.length;
      if (n === c._shown) return;
      for (i = (c._shown < 0 ? 0 : c._shown); i < n; i++) c._chs[i].classList.add('on');
      c._shown = n;
      if (n > 0 && c._cur){ var t = c._chs[n - 1]; t.parentNode.insertBefore(c._cur, t.nextSibling); }
    } else {
      for (var i2 = 0; i2 < c._lns.length; i2++) c._lns[i2].classList.add('on');
    }
  }

  /* ============ harvested-star lattice (generated, deterministic) ============ */
  var NS = 'http://www.w3.org/2000/svg';
  function buildLattice(svg, n, seed, near){
    var s = seed >>> 0;
    function rnd(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
    var pts = [], i, j;
    for (i = 0; i < n; i++) pts.push([60 + rnd()*1800, 40 + rnd()*1000, rnd()]);
    // streams first, under the nodes
    for (i = 0; i < n; i++){
      var best = -1, bd = near ? 5e5 : 1.2e5;
      for (j = i + 1; j < n; j++){
        var dx = pts[i][0]-pts[j][0], dy = pts[i][1]-pts[j][1], d2 = dx*dx + dy*dy;
        if (d2 < bd){ bd = d2; best = j; }
      }
      if (best < 0) continue;
      var ln = document.createElementNS(NS, 'line');
      ln.setAttribute('x1', pts[i][0].toFixed(1)); ln.setAttribute('y1', pts[i][1].toFixed(1));
      ln.setAttribute('x2', pts[best][0].toFixed(1)); ln.setAttribute('y2', pts[best][1].toFixed(1));
      ln.setAttribute('class', near ? 'st2' : 'st');
      ln.setAttribute('stroke-width', near ? '1.3' : '1');
      ln.setAttribute('stroke-opacity', near ? '.42' : '.28');
      ln.setAttribute('stroke-dasharray', near ? '6 30' : '5 26');
      ln.style.animationDelay = (-rnd()*9).toFixed(2) + 's';
      ln.style.animationDuration = (near ? 5 : 6.5 + rnd()*3).toFixed(2) + 's';
      svg.appendChild(ln);
    }
    for (i = 0; i < n; i++){
      var g = document.createElementNS(NS, 'g'), k = near ? 1.7 : 1;
      var warm = pts[i][2] < 0.6;   // most stars in the corridor are harvested — dimmed amber
      var halo = document.createElementNS(NS, 'circle');
      halo.setAttribute('cx', pts[i][0]); halo.setAttribute('cy', pts[i][1]);
      halo.setAttribute('r', (5 + pts[i][2]*5) * k);
      halo.setAttribute('fill', warm ? 'rgba(246,214,168,.08)' : 'rgba(191,222,255,.09)');
      g.appendChild(halo);
      var core = document.createElementNS(NS, 'circle');
      core.setAttribute('cx', pts[i][0]); core.setAttribute('cy', pts[i][1]);
      core.setAttribute('r', ((warm ? 1.0 : 1.3) + pts[i][2]) * k);
      core.setAttribute('fill', warm ? '#e8c9a0' : '#dfe9ff');
      if (pts[i][2] > 0.75) core.style.animation = 'shimmer ' + (4 + pts[i][2]*6).toFixed(1) + 's ease-in-out infinite ' + (-pts[i][2]*5).toFixed(1) + 's';
      g.appendChild(core);
      if (warm){  // each harvested star wears its own partial shell
        var ring = document.createElementNS(NS, 'circle');
        ring.setAttribute('cx', pts[i][0]); ring.setAttribute('cy', pts[i][1]);
        ring.setAttribute('r', 4.2 * k);
        ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', 'rgba(255,190,120,.45)');
        ring.setAttribute('stroke-width', (0.7 * k).toFixed(2));
        g.appendChild(ring);
      }
      svg.appendChild(g);
    }
  }
  buildLattice(el('latFar'), 96, 20260718, false);
  buildLattice(el('latNear'), 26, 71802602, true);

  /* ============ starfield canvas: forward streaming + lensing ============ */
  var starCv = el('stars');
  var starCx = starCv.getContext('2d');
  var W = 0, H = 0, DPR = 1, maxR = 1, vmin = 1;

  var starList = [];
  function seedStars(){
    starList.length = 0;
    var n = Math.round(W * H / 5200);
    for (var i = 0; i < n; i++){
      starList.push({
        a: Math.random() * 6.2832,
        d: Math.sqrt(Math.random()) * 1.1,
        z: 0.15 + Math.random() * 0.85,
        r: Math.random() < 0.85 ? (0.4 + Math.random()*0.8) : (1.1 + Math.random()*0.9),
        tw: 2 + Math.random()*5, ph: Math.random()*Math.PI*2,
        warm: Math.random() < 0.14
      });
    }
  }
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    vmin = Math.min(W, H);
    maxR = Math.hypot(W, H) * 0.62;
    starCv.width = Math.round(W*DPR); starCv.height = Math.round(H*DPR);
    starCx.setTransform(DPR,0,0,DPR,0,0);
    seedStars();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ============ the migration fleet ============ */
  var TRAVEL = 0.115;                       // p spent crossing to the aperture
  var TARGET = { x: 50, y: 46 };            // vw / vh
  var LANES = [
    { from:{x:-12, y:88},  t0:.780, h:.0095, s0:1.15, designs:['migC','migC','migA','migC','migB','migC'], flip:1,  w:{migA:21,migB:17,migC:13}, z:23 },
    { from:{x:112, y:82},  t0:.790, h:.0095, s0:1.00, designs:['migC','migB','migC','migC','migA'],        flip:-1, w:{migA:19,migB:15,migC:11}, z:22 },
    { from:{x:46,  y:114}, t0:.786, h:.0105, s0:1.50, designs:['migA','migC','migB','migC'],               flip:1,  w:{migA:24,migB:19,migC:15}, z:24 }
  ];
  var ships = [];
  (function buildFleet(){
    var host = el('fleet');
    for (var li = 0; li < LANES.length; li++){
      var L = LANES[li];
      var ang = Math.atan2(TARGET.y - L.from.y, TARGET.x - L.from.x) * 180 / Math.PI;
      for (var i = 0; i < L.designs.length; i++){
        var d = document.createElement('div');
        d.className = 'mig';
        d.style.width = L.w[L.designs[i]] + 'vw';
        d.style.zIndex = L.z;
        d.innerHTML = '<svg viewBox="-160 -100 320 200"><use href="#' + L.designs[i] + '"/></svg>';
        host.appendChild(d);
        ships.push({ el: d, t0: L.t0 + i * L.h, from: L.from, s0: L.s0, ang: ang, flip: L.flip, gone: false });
      }
    }
  })();
  var gulpT = -1e9;

  /* ============ main loop ============ */
  var t0 = null, lastT = null;
  var replayBtn = el('replay');
  var fader = el('fader');
  var done = false, endFading = false;
  var seek = parseFloat((location.hash.match(/p=([\d.]+)/) || [])[1]);

  function frame(now){
    if (t0 === null){
      t0 = now;
      if (!isNaN(seek)) t0 = now - clamp01(seek) * DUR;
      lastT = now;
    }
    var dt = Math.min((now - lastT)/1000, 0.1);
    lastT = now;

    var raw = (now - t0)/DUR;
    var p = clamp01(raw);            // constant speed: linear, never accelerates
    if (reduced) p = 0.55;

    /* ---- sphere state, shared by everything below ---- */
    var sc  = kf(p, SC);
    var sxv = kf(p, SX);
    var lit = sstep(ramp(p, .15, .42));
    var apOpen = sstep(ramp(p, .42, .545)) * (1 - sstep(ramp(p, .948, .985)));
    var lens = sstep(ramp(p, .60, .74)) * (1 - ramp(p, .94, .985));
    var tearIn = sstep(ramp(p, .800, .850)) * (1 - sstep(ramp(p, .945, .978)));
    var fr  = sstep(ramp(p, .945, .99));            // ring fold
    var dim = sstep(ramp(p, .955, .998));           // the light goes out
    var alive = 1 - ramp(p, .93, .965);             // conduits/lights die before the fold
    lit = lit * (1 - .94*dim);
    var rot = -26 * (1 - sstep(ramp(p, .06, .46)));

    /* ---- parallax: every layer scales about the vanishing point ---- */
    for (var i = 0; i < layers.length; i++){
      layers[i].el.style.transform = 'scale(' + (1 + p * layers[i].f) + ')';
    }

    /* ---- sphere transform + silhouette ---- */
    sph.style.opacity = ramp(p, .015, .10);
    sph.style.transform = 'translate(-50%,-50%) translate(' + sxv.toFixed(3) + 'vw,0) scale(' + sc.toFixed(4) + ')';
    sphAll.setAttribute('transform', 'rotate(' + rot.toFixed(2) + ')');

    panels.setAttribute('opacity', (lit * .95).toFixed(3));
    silCover.setAttribute('opacity', ((1 - lit) * .92).toFixed(3));
    el('apGrp').setAttribute('opacity', (1 - dim * .94).toFixed(3));
    housing.setAttribute('opacity', (lit).toFixed(3));
    rimHi.setAttribute('opacity', (lit * .7).toFixed(3));
    escort.setAttribute('opacity', (ramp(p, .30, .40) * (1 - ramp(p, .88, .94))).toFixed(3));

    var ringO = lit * (1 - fr);
    tiltBack.setAttribute('opacity', (ringO * .55).toFixed(3));
    tiltFront.setAttribute('opacity', ringO.toFixed(3));
    freeRings.setAttribute('opacity', (ringO * .8).toFixed(3));
    if (fr > 0){
      var fsx = (1 - .5*fr).toFixed(4), fsy = (1 - .93*fr).toFixed(4);
      var ftf = 'scale(' + fsx + ',' + fsy + ')';
      tiltBack.setAttribute('transform', ftf);
      tiltFront.setAttribute('transform', ftf);
      freeRings.setAttribute('transform', ftf);
    } else {
      tiltBack.removeAttribute('transform');
      tiltFront.removeAttribute('transform');
      freeRings.removeAttribute('transform');
    }

    /* ---- iris + core + conduits ---- */
    var out = 170 * apOpen;
    for (i = 0; i < petalEls.length; i++) petalEls[i].setAttribute('transform', 'translate(0,' + (-out).toFixed(1) + ')');
    var coreO = apOpen * (1 - tearIn) * alive;
    coreGrp.setAttribute('opacity', coreO.toFixed(3));
    // critical output: the pulse quickens and deepens as space starts to bend
    coreHot.setAttribute('opacity', (coreO * (.25 + .55*lens) * (.5 + .5*Math.sin(now * (0.004 + 0.011*lens)))).toFixed(3));
    spill.setAttribute('opacity', (apOpen * alive * .55).toFixed(3));
    skyGlow.style.opacity = apOpen * alive * (0.5 + 0.5*sstep(ramp(p, .5, .7)));
    for (i = 0; i < 4; i++){
      var on = ramp(p, CD_AT[i], CD_AT[i] + .045) * alive;
      cds[i].setAttribute('opacity', on.toFixed(3));
      lts[i].setAttribute('opacity', (on * .9).toFixed(3));
    }
    var mr = 20 * apOpen * alive;
    miniA.setAttribute('r', mr.toFixed(1));
    miniB.setAttribute('r', (mr * .8).toFixed(1));

    /* ---- the tear ---- */
    var tearR = 152 * tearIn;
    tearC.setAttribute('r', tearR.toFixed(1));
    tearRim.setAttribute('r', Math.max(tearR - 2, 0).toFixed(1));
    tearRim.setAttribute('opacity', (.9 * clamp01(tearR / 50) * (1 - dim)).toFixed(3));
    tearG.setAttribute('opacity', tearIn > 0 ? 1 : 0);
    skyTear.style.opacity = tearIn * .9;

    /* ---- lensing ---- */
    lensHalo.setAttribute('opacity', (lens * .8).toFixed(3));

    /* ---- the pulse ---- */
    var pu = ramp(p, .790, .842);
    if (pu > 0 && pu < 1){
      pulseRing.style.opacity = (1 - pu) * .85;
      pulseRing.style.transform = 'translate(-50%,-50%) scale(' + (.25 + 2.6*sstep(pu)).toFixed(3) + ')';
    } else pulseRing.style.opacity = 0;
    pulseFlash.style.opacity = ramp(p, .790, .802) * (1 - ramp(p, .802, .832)) * .5;

    /* ---- debris + migration lanes ---- */
    debris.style.opacity = ramp(p, .57, .67) * (1 - ramp(p, .96, .99));
    migStream.style.opacity = ramp(p, .783, .802) * (1 - ramp(p, .928, .945));

    /* ---- fleet ---- */
    for (i = 0; i < ships.length; i++){
      var sh = ships[i];
      var u = (p - sh.t0) / TRAVEL;
      if (u <= 0 || u >= 1){
        if (u >= 1 && !sh.gone && p < 1){ sh.gone = true; gulpT = now; }
        if (u <= 0) sh.gone = false;
        sh.el.style.opacity = 0;
        continue;
      }
      var x = sh.from.x + (TARGET.x - sh.from.x) * u;
      var y = sh.from.y + (TARGET.y - sh.from.y) * u;
      var s = sh.s0 * (1 - .96 * u);
      sh.el.style.opacity = Math.min(ramp(u, 0, .04), 1 - ramp(u, .975, 1));
      sh.el.style.transform = 'translate3d(' + x.toFixed(2) + 'vw,' + y.toFixed(2) + 'vh,0) translate(-50%,-50%) rotate(' + sh.ang.toFixed(1) + 'deg) scale(' + s.toFixed(3) + ',' + (s * sh.flip).toFixed(3) + ')';
    }
    gulp.style.opacity = Math.exp(-(now - gulpT) / 200) * .95;

    /* ---- captions ---- */
    var want = -1, k;
    for (k = 0; k < CAPS.length; k++) if (p >= CAPS[k].a && p <= CAPS[k].b) { want = k; break; }
    if (want !== curCap){
      curCap = want;
      if (want >= 0){ capSm.textContent = CAPS[want].k; mountCap(CAPS[want], now); }
    }
    if (want >= 0){
      var c = CAPS[want];
      revealCap(c, now);
      capEl.style.opacity = (ramp(p, c.a, c.a + 0.02) * (1 - ramp(p, c.b - 0.02, c.b)) * 0.92);
    } else capEl.style.opacity = 0;

    /* ---- stars: forward streaming, occlusion, lensing ---- */
    var cxs = W * (0.5 + sxv / 100), cys = H * 0.46;
    var rPx = 1.30 * vmin * 0.3519 * sc * ramp(p, .015, .10);
    starCx.clearRect(0,0,W,H);
    for (i = 0; i < starList.length; i++){
      var st = starList[i];
      if (!reduced){
        st.d *= 1 + 0.026 * st.z * dt;
        if (st.d > 1.18){ st.d = 0.04 + Math.random()*0.25; st.a = Math.random()*6.2832; }
      }
      var x2 = cxs + Math.cos(st.a) * st.d * maxR;
      var y2 = cys + Math.sin(st.a) * st.d * maxR;
      var dxs = x2 - cxs, dys = y2 - cys, ds = st.d * maxR;
      if (ds < rPx * 0.99) continue;                       // behind the sphere
      var tw = 0.55 + 0.45*Math.sin(now/1000*st.tw + st.ph);
      var a = tw * clamp01(st.d * 6);
      if (a < 0.02) continue;
      var col = st.warm ? '#f6e0c8' : '#dfe9ff';
      var lt = 0;
      if (lens > 0 && ds < rPx * 2.6 && rPx > 4){
        lt = clamp01(1 - (ds - rPx) / (rPx * 1.6));
        var push = lens * lt * rPx * 0.16;
        x2 += dxs/ds * push; y2 += dys/ds * push;
      }
      var len = lens * lt * lt * rPx * 0.5;
      starCx.globalAlpha = a;
      if (len > 1.5){
        var tx = -dys/ds, ty = dxs/ds;
        starCx.strokeStyle = col;
        starCx.lineWidth = st.r * 1.5;
        starCx.beginPath();
        starCx.moveTo(x2 - tx*len/2, y2 - ty*len/2);
        starCx.lineTo(x2 + tx*len/2, y2 + ty*len/2);
        starCx.stroke();
      } else {
        starCx.fillStyle = col;
        starCx.beginPath();
        starCx.arc(x2, y2, st.r, 0, 6.2832);
        starCx.fill();
      }
    }
    starCx.globalAlpha = 1;

    /* ---- the end: light gone, drift into black ---- */
    if (!reduced && p > .985 && !endFading){
      endFading = true;
      fader.style.transition = 'opacity 3s ease';
      fader.style.opacity = 1;
    }
    if (raw >= 1.04 && !done){ done = true; replayBtn.classList.add('on'); }

    requestAnimationFrame(frame);
  }

  replayBtn.addEventListener('click', function(){
    done = false; endFading = false; curCap = -1; seek = NaN;
    for (var i = 0; i < ships.length; i++) ships[i].gone = false;
    gulpT = -1e9;
    replayBtn.classList.remove('on');
    fader.style.transition = 'opacity .6s ease';
    fader.style.opacity = 1;
    setTimeout(function(){
      t0 = null;
      fader.style.transition = 'opacity 2.8s ease';
      fader.style.opacity = 0;
    }, 700);
  });

  // fade up from black and begin the shot
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ fader.style.opacity = 0; });
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
