<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Stellar Foundry — Arrival at Protostar-7</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap');

/* ============================================================
   ARRIVAL — a single-shot cinematic 2D parallax environment.
   One continuous ~70s vertical pan: deep space → upper
   atmosphere → cloud deck → needle peaks → the hidden city.
   All art is hand-placed SVG; motion is many small independent
   loops. No cuts, no shakes, no zooms.
   ============================================================ */

:root{
  --ink:#0b0d1f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#05060f;font-family:"Chakra Petch","Bank Gothic",Eurostile,"Segoe UI",Arial,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;transform:translateZ(0)}

/* ---------- sky (three cross-faded flat-band gradients) ---------- */
.sky{position:absolute;inset:0;pointer-events:none}
#sky-day{background:linear-gradient(#4fa9d8 0%,#6fc2e2 34%,#9bd6ea 55%,#c9b4e6 80%,#b79ade 100%)}
#sky-strat{background:linear-gradient(#131a3f 0%,#2c3268 38%,#54549c 70%,#8079c0 100%)}
#sky-space{background:linear-gradient(#04050d 0%,#0a0d22 62%,#141838 100%)}
#sky-doom{background:linear-gradient(#1c0708 0%,#4a120c 30%,#7e2312 55%,#b34a22 78%,#d4703a 96%,#e08a4a 100%);opacity:0}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:1}
#particles{z-index:20}

/* ---------- parallax layers ---------- */
.layer{position:absolute;inset:0;will-change:transform;pointer-events:none}
.piece{position:absolute;left:0;width:100%}
.piece svg{display:block;width:100%;height:100%}

#layer-nebula{z-index:2}
#layer-sun{z-index:3}
#layer-moon{z-index:4}
#layer-fleet{z-index:5}
#layer-cirrus{z-index:6}
#layer-farmtn{z-index:7}
#layer-cumulus{z-index:8}
#layer-midmtn{z-index:9}
#layer-city{z-index:10}
#layer-valley{z-index:11}
#layer-fg{z-index:13}

/* ---------- lone scout crossing the cloud deck ---------- */
#crossship{position:absolute;top:37vh;left:0;width:24vw;min-width:300px;z-index:9;opacity:0;pointer-events:none;will-change:transform,opacity}
#crossship svg{display:block;width:100%;height:auto}

/* ---------- nebula: two soft cosmic dust fields ---------- */
.neb{position:absolute;border-radius:50%;filter:blur(28px)}
.neb.a{top:8vh;left:12vw;width:46vw;height:34vh;
  background:radial-gradient(closest-side,rgba(151,94,196,.30),rgba(151,94,196,0) 70%)}
.neb.b{top:34vh;left:52vw;width:40vw;height:30vh;
  background:radial-gradient(closest-side,rgba(76,120,201,.26),rgba(76,120,201,0) 70%)}
.neb.c{top:2vh;left:60vw;width:26vw;height:20vh;
  background:radial-gradient(closest-side,rgba(214,120,168,.16),rgba(214,120,168,0) 70%)}

/* ---------- generic ambient motion ---------- */
@keyframes driftR{from{transform:translate3d(-2.5vw,0,0)}to{transform:translate3d(2.5vw,0,0)}}
@keyframes driftL{from{transform:translate3d(2vw,0,0)}to{transform:translate3d(-2vw,0,0)}}
@keyframes bob{from{transform:translate3d(0,-.5vh,0)}to{transform:translate3d(0,.5vh,0)}}
@keyframes swayA{from{transform:rotate(-1.4deg)}to{transform:rotate(1.6deg)}}
@keyframes swayB{from{transform:rotate(1.2deg)}to{transform:rotate(-1.8deg)}}
@keyframes shimmer{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes blink{0%,92%,100%{opacity:0}94%,97%{opacity:1}}
@keyframes blink2{0%,88%,100%{opacity:.1}90%,94%{opacity:1}}
@keyframes thrustPuff{0%,95.4%,100%{opacity:0}96.2%,98%{opacity:.75}}
@keyframes flow{to{stroke-dashoffset:-480}}
@keyframes flowSlow{to{stroke-dashoffset:-260}}
@keyframes ringSpin{to{stroke-dashoffset:-352}}
@keyframes fleetIn{from{opacity:0;transform:translate3d(5vw,-1.5vh,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes shipDriftA{from{transform:translate3d(0,0,0) rotate(-.5deg)}to{transform:translate3d(-3vw,.8vh,0) rotate(.4deg)}}
@keyframes shipDriftB{from{transform:translate3d(1.5vw,.6vh,0)}to{transform:translate3d(-1.5vw,-.4vh,0)}}
@keyframes platformDescend{from{transform:translate3d(0,0,0)}to{transform:translate3d(-2vw,26vh,0)}}
@keyframes dishTurn{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes panelTrack{from{transform:rotate(-6deg)}to{transform:rotate(7deg)}}
@keyframes mistRoll{from{transform:translate3d(-4vw,0,0) scale(1)}50%{transform:translate3d(0,-.6vh,0) scale(1.06)}to{transform:translate3d(4vw,0,0) scale(1)}}
@keyframes flameFlick{from{transform:scaleX(.9) scaleY(.96)}to{transform:scaleX(1.08) scaleY(1.04)}}
@keyframes smokeRise{from{transform:translateY(0) scale(1)}to{transform:translateY(-22px) scale(1.12)}}
@keyframes boltBlink{0%,26%,54%,100%{opacity:0}8%,18%{opacity:1}34%,44%{opacity:.9}}
@keyframes killA{0%,38.4%{opacity:1}38.9%,100%{opacity:0}}
@keyframes boltAvis{0%,34.8%{opacity:0}35.2%,37.6%{opacity:1}38%,100%{opacity:0}}
@keyframes boltDash{0%{opacity:0;transform:translateX(0)}6%{opacity:1}30%{opacity:1;transform:translateX(90px)}38%,100%{opacity:0;transform:translateX(120px)}}
@keyframes projVis{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes projBoom{0%,49%{opacity:0;transform:scale(.2)}56%{opacity:1;transform:scale(1)}66%,100%{opacity:0;transform:scale(1.7)}}
@keyframes emberUp{0%{opacity:0;transform:translate(0,0) scale(1)}12%{opacity:.95}100%{opacity:0;transform:translate(8px,-90px) scale(.3)}}
@keyframes exhaustP{from{opacity:.95;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(-36px,2px) scale(.35)}}
@keyframes exhaustPv{from{opacity:.95;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(2px,64px) scale(.35)}}
@keyframes boomA{0%,37.8%{opacity:0;transform:scale(.25)}39.4%{opacity:1;transform:scale(1)}44%,100%{opacity:0;transform:scale(1.8)}}
@keyframes wreckA{0%,38.2%{opacity:0}39.2%,68%{opacity:.95}72%,100%{opacity:0}}

.drift-r{animation:driftR 240s ease-in-out infinite alternate}
.drift-r2{animation:driftR 170s ease-in-out infinite alternate-reverse}
.drift-l{animation:driftL 200s ease-in-out infinite alternate}
.drift-l2{animation:driftL 150s ease-in-out infinite alternate-reverse}

/* ---------- mist (near the river / waterfall bases) ---------- */
.mist{position:absolute;border-radius:50%;filter:blur(14px);
  background:radial-gradient(closest-side,rgba(226,238,250,.42),rgba(226,238,250,0) 72%)}

/* ---------- pass-through cloud veil ---------- */
#cloudveil{position:absolute;inset:0;z-index:25;opacity:0;pointer-events:none}
#cloudveil .cv{position:absolute;border-radius:50%;filter:blur(22px);
  background:radial-gradient(closest-side,rgba(244,232,224,.95),rgba(244,232,224,0) 72%)}

/* ---------- atmospheric haze over the basin ---------- */
#haze{position:absolute;inset:0;z-index:12;opacity:0;pointer-events:none;
  background:linear-gradient(rgba(150,200,235,0) 46%,rgba(163,206,238,.34) 74%,rgba(197,224,244,.5) 100%)}

/* ---------- cinema chrome ---------- */
#vignette{position:absolute;inset:0;z-index:30;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 46%,rgba(0,0,0,0) 58%,rgba(4,6,16,.42) 100%)}
.bar{position:absolute;left:0;width:100%;height:5.5vh;background:#020308;z-index:31}
#bar-t{top:0}#bar-b{bottom:0}

#caption{position:absolute;left:6vw;bottom:9.5vh;z-index:32;max-width:52ch;
  color:#dfe8f5;font-size:clamp(13px,1.4vw,19px);line-height:1.6;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;opacity:0;
  text-shadow:0 1px 12px rgba(4,8,20,.8)}
#caption small{display:block;letter-spacing:.34em;font-weight:500;font-size:.72em;color:#8fb4d8;margin-bottom:.5em}

#fader{position:absolute;inset:0;background:#020308;z-index:40;pointer-events:none;transition:opacity 2.8s ease}
#replay{position:absolute;right:5vw;bottom:8.5vh;z-index:33;opacity:0;pointer-events:none;
  transition:opacity 2s ease;background:none;border:1px solid rgba(190,215,240,.45);
  color:#d5e4f4;font:inherit;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  padding:.55em 1.2em;cursor:pointer;border-radius:2px}
#replay.on{opacity:.85;pointer-events:auto}
#replay:hover{background:rgba(190,215,240,.12)}

/* ---------- ACT 2 chrome ---------- */
#continue,#continue2{position:absolute;left:50%;transform:translateX(-50%);bottom:8.5vh;z-index:33;opacity:0;pointer-events:none;
  transition:opacity 2s ease;background:rgba(20,8,6,.4);border:1px solid rgba(255,170,140,.55);
  color:#ffe2d5;font:inherit;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  padding:.55em 1.2em;cursor:pointer;border-radius:2px}
#continue.on,#continue2.on{opacity:.92;pointer-events:auto}
#continue:hover,#continue2:hover{background:rgba(255,170,140,.14)}
#ascentship{position:absolute;top:0;left:0;width:15vw;min-width:190px;z-index:8;opacity:0;pointer-events:none;will-change:transform,opacity}
#ascentship svg{display:block;width:100%;height:auto;overflow:visible}
#dogfight{position:absolute;inset:0;z-index:12;opacity:0;pointer-events:none}
#dogfight svg{width:100%;height:100%}
#strikeflash{position:absolute;inset:0;z-index:24;opacity:0;pointer-events:none;
  background:radial-gradient(80% 60% at 50% 55%,rgba(255,150,100,.55),rgba(255,80,50,.12) 60%,rgba(0,0,0,0) 100%)}
#doomtint{position:absolute;inset:0;z-index:26;opacity:0;pointer-events:none;mix-blend-mode:multiply;background:#d98d66}

.reduced .layer,.reduced svg *{animation:none!important}
</style>
</head>
<body>
<div id="stage">

  <div class="sky" id="sky-day"></div>
  <div class="sky" id="sky-strat"></div>
  <div class="sky" id="sky-space"></div>
  <div class="sky" id="sky-doom"></div>

  <canvas id="stars"></canvas>

  <!-- =================== NEBULA / COSMIC DUST (f .045) =================== -->
  <div class="layer" data-f="0.045" id="layer-nebula">
    <div class="piece" style="top:0;height:130vh">
      <div class="neb a drift-r"></div>
      <div class="neb b drift-l"></div>
      <div class="neb c drift-r2"></div>
    </div>
  </div>

  <!-- =================== DISTANT SUN (f .03) =================== -->
  <div class="layer" data-f="0.03" id="layer-sun">
    <div class="piece" id="sunpiece" style="top:9vh;left:auto;right:10vw;width:9vw;height:9vw">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="26" fill="#f9e6c4" opacity=".14"/>
        <circle cx="100" cy="100" r="13" fill="#fbedd2" opacity=".5"/>
        <circle cx="100" cy="100" r="7" fill="#fff3da"/>
        <circle cx="100" cy="100" r="3.5" fill="#ffffff"/>
        <path d="M100 78v-26M100 122v26M78 100H52M122 100h26" stroke="#f4e2c0" stroke-width="1.6" opacity=".65"/>
      </svg>
    </div>
  </div>

  <!-- =================== MOON (f .05) =================== -->
  <div class="layer" data-f="0.05" id="layer-moon">
    <div class="piece" style="top:24vh;left:66vw;width:9vw;height:9vw;min-width:70px;min-height:70px">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="34" fill="#e3d3de"/>
        <path d="M60 26a34 34 0 0 1 0 68 40 40 0 0 0 0-68z" fill="#c9b6cc"/>
        <circle cx="47" cy="50" r="6" fill="#cdbccf"/>
        <circle cx="66" cy="72" r="4.5" fill="#c4afc8"/>
        <circle cx="55" cy="66" r="2.6" fill="#c9b6cc"/>
        <circle cx="70" cy="44" r="3" fill="#d3c2d5"/>
        <path d="M31 45a34 34 0 0 1 22-17" stroke="#f4ecf4" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- =================== EXPEDITION FLEET (f .18) =================== -->
  <div class="layer" data-f="0.18" id="layer-fleet">
    <div class="piece" style="top:22vh;height:95vh;animation:fleetIn 14s ease-out 5s both">
      <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:100%;min-width:1050px;height:100%">
      <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- long-period drift keeps the fleet coasting, never "flying" -->
        </defs>

        <!-- ===== SHIP A — "Vantage"-class survey carrier =====
             long open truss spine, counter-rotating gravity ring,
             suspended hab/cargo modules, aft drive block, radiator vanes -->
        <g style="animation:shipDriftA 210s ease-in-out infinite alternate">
          <g transform="translate(260,215)">
            <!-- gravity ring, mounted on a solid hub amidships -->
            <ellipse cx="176" cy="0" rx="27" ry="80" fill="none" stroke="#2b3354" stroke-width="13"/>
            <ellipse cx="176" cy="0" rx="27" ry="80" fill="none" stroke="#7d8fc2" stroke-width="4"
              stroke-dasharray="28 30" style="animation:ringSpin 60s linear infinite"/>
            <rect x="150" y="-13" width="58" height="26" rx="3" fill="#39406a"/>
            <path d="M150 -13 h58" stroke="#8fa2d6" stroke-width="1.3"/>

            <!-- integrated lower utility deck (flush, not dangling) -->
            <path d="M54 13 H452 L430 42 H76 Z" fill="#2a3152"/>
            <path d="M54 13 H452" stroke="#8fa2d6" stroke-width="1.1"/>
            <rect x="96" y="18" width="62" height="20" rx="2" fill="#414a76"/>
            <rect x="104" y="23" width="22" height="8" fill="#bfeeff" opacity=".85"/>
            <rect x="182" y="18" width="74" height="21" rx="2" fill="#39406a"/>
            <rect x="190" y="22" width="18" height="6" fill="#9fe8b8" opacity=".85"/>
            <rect x="304" y="18" width="88" height="19" rx="2" fill="#414a76"/>
            <path d="M304 18 h88" stroke="#7d8fc2" stroke-width="1"/>

            <!-- main hull beam, with structural depth and a raised spine -->
            <path d="M-34 -15 H498 L520 -6 L520 6 L498 15 H-34 Z" fill="#3a4269"/>
            <rect x="58" y="-21" width="356" height="7" rx="2" fill="#333b60"/>
            <path d="M-34 -15 H498 L520 -6" fill="none" stroke="#aabdea" stroke-width="1.6"/>
            <path d="M-34 15 H498 L520 6" fill="none" stroke="#222a48" stroke-width="2.2"/>
            <path d="M8 -15 V15 M56 -15 V15 M104 -15 V15 M232 -15 V15 M280 -15 V15 M328 -15 V15 M404 -15 V15 M452 -15 V15" stroke="#2c3355" stroke-width="2.4"/>
            <path d="M-34 0 H498" stroke="#2c3355" stroke-width="1.3" opacity=".55"/>

            <!-- command head: layered armored prow, flush to the hull -->
            <rect x="-42" y="-18" width="12" height="36" rx="2" fill="#2c3355"/>
            <path d="M-34 -15 L-102 -23 L-132 -13 L-144 -2 L-140 12 L-116 20 L-82 23 L-34 15 Z" fill="#434c74"/>
            <path d="M-34 -15 L-102 -23 L-132 -13 L-98 -8 L-34 -6 Z" fill="#4d5886"/>
            <path d="M-140 12 L-116 20 L-82 23 L-34 15 L-34 9 L-104 11 Z" fill="#333b60"/>
            <path d="M-102 -23 L-132 -13 L-144 -2" fill="none" stroke="#aabdea" stroke-width="1.6"/>
            <path d="M-140 12 L-116 20 L-82 23" fill="none" stroke="#222a48" stroke-width="2"/>
            <path d="M-128 -8 L-90 -13 L-84 4 L-120 8 Z" fill="#bfeeff"/>
            <path d="M-128 -8 L-90 -13" stroke="#eafcff" stroke-width="1.3"/>
            <path d="M-108 -10.5 L-103 6" stroke="#7fc4dd" stroke-width="1.2"/>
            <path d="M-74 -19 V19 M-56 -17 V17" stroke="#2c3355" stroke-width="2"/>
            <rect x="-72" y="-13" width="12" height="8" rx="1" fill="#c97b6a"/>
            <circle cx="-130" cy="6" r="3.4" fill="#2c3354"/>
            <circle cx="-130" cy="6" r="1.4" fill="#9fe8ff" style="animation:blink2 5s linear infinite 1s"/>
            <path d="M-116 -21 v-15 l12 -5" stroke="#8fa2d6" stroke-width="2" fill="none"/>
            <circle cx="-104" cy="-43" r="2.4" fill="#ffd9d0" style="animation:blink 9s linear infinite"/>

            <!-- radiator fins, solidly rooted on the spine -->
            <rect x="150" y="-24" width="152" height="6" fill="#2c3355"/>
            <path d="M166 -24 l8 -40 h13 l-3 40 Z" fill="#b06a72"/>
            <path d="M206 -24 l8 -34 h13 l-3 34 Z" fill="#9d5a66"/>
            <path d="M246 -24 l7 -30 h12 l-2 30 Z" fill="#b06a72"/>
            <path d="M284 -24 l6 -24 h11 l-2 24 Z" fill="#9d5a66"/>

            <!-- sensor mast, rooted -->
            <path d="M406 -21 v-30" stroke="#8fa2d6" stroke-width="2.4"/>
            <circle cx="406" cy="-54" r="5" fill="none" stroke="#8fa2d6" stroke-width="2"/>
            <circle cx="406" cy="-54" r="1.8" fill="#ffe9b8" style="animation:blink 12s linear infinite 3s"/>

            <!-- aft twin-engine block -->
            <path d="M498 -15 L470 -24 L470 24 L498 15 Z" fill="#2c3354"/>
            <rect x="496" y="-22" width="30" height="17" rx="3" fill="#3d466e"/>
            <rect x="496" y="5" width="30" height="17" rx="3" fill="#3d466e"/>
            <path d="M526 -19 h9 l6 5 v5 l-6 5 h-9 Z" fill="#1f2542"/>
            <path d="M526 8 h9 l6 5 v5 l-6 5 h-9 Z" fill="#1f2542"/>
            <!-- matched twin exhaust: equal idle glow, both puff in sync -->
            <ellipse cx="533" cy="-11" rx="4" ry="5" fill="#9fe8ff" opacity=".32"/>
            <ellipse cx="533" cy="16" rx="4" ry="5" fill="#9fe8ff" opacity=".32"/>
            <path d="M541 -11 l26 4 -26 4 z" fill="#9fe8ff" style="animation:thrustPuff 19s linear infinite"/>
            <path d="M541 16 l26 4 -26 4 z" fill="#9fe8ff" style="animation:thrustPuff 19s linear infinite"/>

            <!-- nav lights -->
            <circle cx="-146" cy="-2" r="2.2" fill="#ff8f8f" style="animation:blink 6s linear infinite"/>
            <circle cx="150" cy="-24" r="2" fill="#d7ffe2" style="animation:blink 7s linear infinite 2s"/>
          </g>

          <!-- shuttle peeling away from the carrier, drifting down to the surface -->
          <g opacity=".95">
            <path id="shuttlePath" d="M560,260 C640,340 560,520 700,700 C760,790 900,860 1040,900" fill="none"/>
            <g>
              <animateMotion dur="95s" begin="18s" repeatCount="indefinite" rotate="auto">
                <mpath href="#shuttlePath"/>
              </animateMotion>
              <path d="M0 0 L16 -4 L24 0 L16 4 Z" fill="#46507c"/>
              <path d="M16 -4 L24 0" stroke="#aabdea" stroke-width="1"/>
              <circle cx="2" cy="0" r="1.6" fill="#9fe8ff" style="animation:blink2 4s linear infinite"/>
            </g>
            <g>
              <animateMotion dur="110s" begin="52s" repeatCount="indefinite" rotate="auto">
                <mpath href="#shuttlePath"/>
              </animateMotion>
              <path d="M0 0 L13 -3 L19 0 L13 3 Z" fill="#3d466e"/>
              <circle cx="2" cy="0" r="1.4" fill="#ffe9b8" style="animation:blink2 5s linear infinite 1s"/>
            </g>
          </g>

          <!-- cargo platform on slow descent -->
          <g style="animation:platformDescend 240s linear infinite" opacity=".9">
            <g transform="translate(430,300)">
              <rect x="-26" y="0" width="52" height="8" rx="2" fill="#38406a"/>
              <path d="M-26 0h52" stroke="#a5b8e6" stroke-width="1.1"/>
              <rect x="-16" y="-12" width="14" height="12" fill="#4a5480"/>
              <rect x="2" y="-9" width="11" height="9" fill="#414a76"/>
              <circle cx="-24" cy="4" r="1.6" fill="#ff8f8f" style="animation:blink 5s linear infinite 2s"/>
              <path d="M-14 8 l-3 8M14 8 l3 8" stroke="#9fe8ff" stroke-width="1.4" opacity=".55"/>
            </g>
          </g>
        </g>

        <!-- ===== SHIP B — "Weir"-class sail freighter =====
             asymmetric keel hull, exposed ribs, two raked energy sails -->
        <g style="animation:shipDriftB 180s ease-in-out infinite alternate">
          <g transform="translate(980,430)">
            <!-- energy sails -->
            <path d="M60 -12 L34 -128 L118 -96 L120 -14 Z" fill="rgba(140,226,255,.15)" stroke="#9fe0f8" stroke-width="1.6"/>
            <path d="M170 -12 L158 -158 L236 -104 L226 -14 Z" fill="rgba(140,226,255,.12)" stroke="#9fe0f8" stroke-width="1.6" style="animation:shimmer 11s ease-in-out infinite"/>
            <path d="M60 -12 L34 -128M170 -12 L158 -158" stroke="#5b6890" stroke-width="3"/>
            <path d="M34 -128 L-8 -6M158 -158 L96 -8M236 -104 L268 -4" stroke="#5b6890" stroke-width="1" opacity=".8"/>
            <!-- hull: long asymmetric keel -->
            <path d="M-40 -6 L288 -14 L322 4 L272 26 L60 32 L-16 18 Z" fill="#3d466e"/>
            <path d="M-40 -6 L288 -14 L322 4" fill="none" stroke="#aabdea" stroke-width="1.6"/>
            <path d="M60 32 L272 26 L322 4" fill="none" stroke="#232948" stroke-width="3"/>
            <!-- exposed ribs -->
            <path d="M20 -7v32M62 -8v38M104 -9v38M146 -10v37M188 -11v36M230 -12v35" stroke="#2a3153" stroke-width="4"/>
            <!-- armored prow plate at the bow -->
            <path d="M288 -14 L322 4 L272 26 L280 4 Z" fill="#46507c"/>
            <path d="M288 -14 L280 4 L272 26" fill="none" stroke="#2a3153" stroke-width="2"/>
            <path d="M272 26 L322 4" stroke="#232948" stroke-width="3" fill="none"/>
            <circle cx="304" cy="3" r="1.8" fill="#9fe8ff" style="animation:blink2 6s linear infinite 2s"/>
            <!-- stepped bridge tower with visor window -->

  <!-- pass-through cloud veil -->
  <div id="cloudveil">
    <div class="cv" style="top:-10%;left:-16%;width:70%;height:56%"></div>
    <div class="cv" style="top:30%;left:40%;width:76%;height:60%"></div>
    <div class="cv" style="top:56%;left:-10%;width:64%;height:52%"></div>
    <div class="cv" style="top:-6%;left:56%;width:60%;height:46%"></div>

  <div id="haze"></div>
  <div id="strikeflash"></div>
  <div id="doomtint"></div>
  <canvas id="particles"></canvas>
  <div id="vignette"></div>
  <div class="bar" id="bar-t"></div>
  <div class="bar" id="bar-b"></div>
  <div id="caption"><small></small><span></span></div>
  <button id="replay" type="button">&#8635;&nbsp; watch again</button>

  <button id="continue2" type="button">&#9654;&nbsp; continue</button>
  <div id="fader"></div>
</div>

<script>
(function(){
  "use strict";

  /* ============ the single shot ============ */
  var DUR = 70000;          // ~70s descent
  var CAM_END = 400;        // total camera travel, in vh (for factor-1 layers)
  var stage = document.getElementById('stage');
  var layers = [].slice.call(document.querySelectorAll('.layer')).map(function(el){
    return { el: el, f: parseFloat(el.getAttribute('data-f')) };
  });

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) document.body.classList.add('reduced');

  // easing: eased at both ends but nearly linear through the middle —
  // the pan should feel like one continuous imperceptible drift
  function ease(t){
    if (t <= 0) return 0; if (t >= 1) return 1;
    // soft start, near-linear cruise, then a long decelerating arrival
    var s = t*t*(3-2*t);
    var w = 0.3 + 0.7*t*t*t;
    return s*w + t*(1-w);
  }
  function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ramp(p, a, b){ return clamp01((p - a) / (b - a)); }

  /* ============ opacity-scripted elements ============ */
  var skySpace = document.getElementById('sky-space');
  var skyStrat = document.getElementById('sky-strat');
  var haze     = document.getElementById('haze');
  var veil     = document.getElementById('cloudveil');
  var cirrus   = document.getElementById('cirrusgroup');
  var cumulus  = document.getElementById('cumulusgroup');
  var sunEl    = document.getElementById('sunpiece');
  var nebula   = document.getElementById('layer-nebula');
  var cross    = document.getElementById('crossship');

  /* ============ captions ============ */
  var capEl = document.getElementById('caption');
  var capSm = capEl.querySelector('small');
  var capTx = capEl.querySelector('span');
  var CAPS = [
    { a:0.015, b:0.15, k:'Protostar-7 — Report 01',
      t:'Deep in Universe-7, Fleet Meridian holds vigil over an old foundry-world. No chart remembers when its fires were first lit.' },
    { a:0.30, b:0.46, k:'Protostar-7 — Report 02',
      t:'Descent begins. No signal answers the fleet — no alarm, no welcome. Only weather, and a hush where a civilization should be.' },
    { a:0.80, b:0.985, k:'Protostar-7 — Report 03',
      t:'Then, beneath the peaks — the city, still lit, still standing. The gravest danger was never what watched from the dark. It was what the foundry could still do to itself.' }
  ];
  var curCap = -1;

  /* ============ starfield canvas ============ */
  var starCv = document.getElementById('stars');
  var starCx = starCv.getContext('2d');
  var pCv = document.getElementById('particles');
  var pCx = pCv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var starList = [];
  function seedStars(){
    starList.length = 0;
    var n = Math.round(W * H / 6500);
    for (var i = 0; i < n; i++){
      starList.push({
        x: Math.random(), y: Math.random(),
        r: Math.random() < 0.85 ? (0.4 + Math.random()*0.8) : (1.1 + Math.random()*0.9),
        tw: 2 + Math.random()*5, ph: Math.random()*Math.PI*2,
        warm: Math.random() < 0.14
      });
    }
  }

  /* ============ atmospheric particles (leaves / spores / dust) ============ */
  var parts = [];
  function seedParts(){
    parts.length = 0;
    var i;
    for (i = 0; i < 9; i++) parts.push({ kind:'leaf',
      x: Math.random()*W, y: Math.random()*H, vx: -(14+Math.random()*22), vy: 9+Math.random()*14,
      rot: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*1.4, s: 4+Math.random()*5,
      sway: Math.random()*Math.PI*2 });
    for (i = 0; i < 26; i++) parts.push({ kind:'spore',
      x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-0.5)*6, vy: -(3+Math.random()*7),
      s: 0.8+Math.random()*1.6, ph: Math.random()*Math.PI*2 });
    for (i = 0; i < 30; i++) parts.push({ kind:'dust',
      x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*2,
      s: 0.5+Math.random()*0.9, ph: Math.random()*Math.PI*2 });
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    [starCv, pCv].forEach(function(c){
      c.width = Math.round(W*DPR); c.height = Math.round(H*DPR);
      c.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
    });
    seedStars(); seedParts();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ============ ACT 2 — the foundry answers ============ */
  function el(id){ return document.getElementById(id); }
  var ACT2 = { started:false, t0:0, shake:0 };
  var contBtn = el('continue');
  var skyDoom = el('sky-doom');
  var doomTint = el('doomtint');
  var strikeFlash = el('strikeflash');
  var dogfight = el('dogfight');
  var toxicG = el('toxic');
  var cityLife = el('cityLife');
  var contReadyAt = null;
  var curCap2 = -1;

  // one strike per district: beam hit, shake, topple at its own angle, then ruin smoke
  var STRIKES = [
    { t:2.5,  tw:el('tw2'), beam:el('bm1'), smoke:el('sm1'), px:450,  py:640, ang:-11, fall:2.6, hy:215, extras:[el('br1a'), el('br1b'), el('br2')] },
    { t:5,    tw:el('twP'), beam:el('bm2'), smoke:el('sm2'), px:580,  py:180, ang:-24, fall:2.2, hy:175, drop:950, extras:[] },
    { t:7.5,  tw:el('tw7'), beam:el('bm3'), smoke:el('sm3'), px:1128, py:640, ang:15,  fall:2.6, hy:345, extras:[el('br4')] },
    { t:10,   tw:el('tw1'), beam:el('bm4'), smoke:el('sm4'), px:288,  py:640, ang:-14, fall:2.6, hy:225, extras:[] },
    { t:13,   tw:el('tw6'), beam:el('bm5'), smoke:el('sm5'), px:930,  py:640, ang:12,  fall:2.6, hy:158, extras:[el('br3')] },
    { t:16,   tw:el('tw5'), beam:el('bm6'), smoke:el('sm6'), px:1320, py:640, ang:-9,  fall:2.6, hy:255, extras:[] },
    { t:20,   tw:el('tw4'), beam:el('bm7'), smoke:el('sm7'), px:730,  py:640, ang:8,   fall:3.4, hy:72,  extras:[] }
  ];
  for (var si = 0; si < STRIKES.length; si++){
    STRIKES[si].lines = STRIKES[si].beam.getElementsByTagName('line');
    STRIKES[si].dots  = STRIKES[si].beam.getElementsByTagName('circle');
    STRIKES[si].spark = STRIKES[si].beam.getElementsByTagName('path')[0];
    STRIKES[si].lastSink = -1;
  }
  var CAPS2 = [
    { a:2,  b:14, k:'Protostar-7 — Report 04',
      t:'The sky opens. Lances from orbit walk across the districts — the foundry has been found, and it is not empty-handed.' },
    { a:22, b:40, k:'Protostar-7 — Report 05',
      t:'Rust squalls boil out of the old works and the towers kneel, one by one. This is the last report from Protostar-7.' }
  ];

  function resetAct2(){
    ACT2.started = false; ACT2.shake = 0;
    contReadyAt = null; curCap2 = -1;
    contBtn.classList.remove('on');
    skyDoom.style.opacity = 0;
    doomTint.style.opacity = 0;
    strikeFlash.style.opacity = 0;
    dogfight.style.opacity = 0;
    toxicG.setAttribute('opacity', 0);
    cityLife.setAttribute('opacity', 1);
    for (var i = 0; i < STRIKES.length; i++){
      var s = STRIKES[i];
      s.tw.removeAttribute('transform');
      s.beam.setAttribute('opacity', 0);
      s.smoke.setAttribute('opacity', 0);
      s.lastSink = -1;
      for (var j = 0; j < s.extras.length; j++) s.extras[j].removeAttribute('transform');
    }
    ACT3.started = false; curCap3 = -1;
    contBtn2.classList.remove('on');
    ascent.style.opacity = 0;
    spaceBattle.setAttribute('opacity', 0);
  }
  contBtn.addEventListener('click', function(){
    ACT2.started = true; ACT2.t0 = performance.now(); curCap2 = -1;
    contBtn.classList.remove('on');
  });

  var ACT3 = { started:false, t0:0 };
  var contBtn2 = el('continue2');
  var ascent = el('ascentship');
  var spaceBattle = el('spacebattle');
  var curCap3 = -1;
  var CAPS3 = [
    { a:1.5, b:10, k:'Protostar-7 — Report 06',
      t:'One shuttle runs for the black, engines screaming, with everything the foundry can still throw close behind.' },
    { a:14,  b:22, k:'Protostar-7 — Report 07',
      t:'Above the ruin the fleet holds the line. Even the stars burn red over Protostar-7 now.' }
  ];
  contBtn2.addEventListener('click', function(){
    ACT3.started = true; ACT3.t0 = performance.now(); curCap3 = -1;
    contBtn2.classList.remove('on');
  });

  /* ============ main loop ============ */
  var t0 = null, lastT = null;
  var replayBtn = document.getElementById('replay');
  var fader = document.getElementById('fader');
  var done = false;

  function frame(now){
    if (t0 === null){ t0 = now; lastT = now; }
    var dt = Math.min((now - lastT)/1000, 0.1);
    lastT = now;

    var raw = (now - t0)/DUR;
    var p = ease(clamp01(raw));
    if (reduced) p = 1;
    var cam = CAM_END * p;

    // after touchdown: the camera breathes, almost still (eased in, no snap)
    if (raw >= 1) cam += (Math.sin(now*0.00012)*1.1 + Math.sin(now*0.00007)*0.6) * clamp01((raw - 1) * 12);

    // ACT 3: the camera climbs back out at a third of the descent time
    var t3 = 0, u3 = 0;
    if (ACT3.started){
      t3 = (now - ACT3.t0)/1000;
      u3 = clamp01(t3 / (DUR/3000));
      var e3 = u3 < .5 ? 2*u3*u3 : 1 - Math.pow(-2*u3 + 2, 2)/2;
      cam = CAM_END * (1 - e3);
    }
    var pv = cam / CAM_END;   // visual altitude 0..1, shared by descent and ascent

    // parallax (plus act-2 ground quake)
    for (var i = 0; i < layers.length; i++){
      var shx = 0, shy = 0;
      if (ACT2.shake > 0){
        shx = Math.sin(now*0.041 + i*1.7) * ACT2.shake;
        shy = Math.cos(now*0.036 + i*0.9) * ACT2.shake * 0.6;
      }
      layers[i].el.style.transform = 'translate3d(' + shx + 'vw,' + (-cam*layers[i].f + shy) + 'vh,0)';
    }

    // sky cross-fade: space → stratosphere → morning
    var spaceO = 1 - ramp(pv, 0.14, 0.42);
    var stratO = ramp(pv, 0.06, 0.26) * (1 - ramp(pv, 0.44, 0.72));
    skySpace.style.opacity = spaceO;
    skyStrat.style.opacity = stratO;
    nebula.style.opacity = spaceO;
    sunEl.style.opacity = 1 - ramp(pv, 0.3, 0.5);

    // atmosphere thickens
    cirrus.style.opacity  = ramp(pv, 0.13, 0.3) * (1 - ramp(pv, 0.8, 1)*0.72);
    cumulus.style.opacity = ramp(pv, 0.24, 0.4);
    haze.style.opacity    = ramp(pv, 0.62, 0.9);

    // brief pass through the cloud deck
    var v = ramp(pv, 0.46, 0.53) * (1 - ramp(pv, 0.55, 0.66));
    veil.style.opacity = v * 0.96;

    // lone scout crossing the cloud deck
    var scT = ramp(p, 0.47, 0.645);
    cross.style.opacity = ramp(p, 0.47, 0.5) * (1 - ramp(p, 0.615, 0.645));
    cross.style.transform = 'translate3d(' + (-26 + scT*152) + 'vw,' + (Math.sin(now*0.0009)*1.2 - scT*4) + 'vh,0)';

    // captions
    var want = -1, k;
    for (k = 0; k < CAPS.length; k++) if (p >= CAPS[k].a && p <= CAPS[k].b) { want = k; break; }
    if (!ACT2.started){
      if (want !== curCap){
        curCap = want;
        if (want >= 0){ capSm.textContent = CAPS[want].k; capTx.textContent = CAPS[want].t; }
      }
      if (want >= 0){
        var c = CAPS[want];
        capEl.style.opacity = (ramp(p, c.a, c.a + 0.03) * (1 - ramp(p, c.b - 0.03, c.b)) * 0.92);
      } else capEl.style.opacity = 0;
    }

    /* ---- stars ---- */
    starCx.clearRect(0,0,W,H);
    var starGlobal = clamp01(1.1 - pv*1.5);
    for (i = 0; i < starList.length; i++){
      var s = starList[i];
      var tw = 0.55 + 0.45*Math.sin(now/1000*s.tw + s.ph);
      // a few stars stay faintly visible high in the sky, even at dawn
      var topKeep = clamp01(1 - (s.y/0.3)) * 0.22;
      var a = tw * Math.min(1, starGlobal + topKeep);
      if (a < 0.02) continue;
      starCx.globalAlpha = a;
      starCx.fillStyle = s.warm ? '#f6e0c8' : '#dfe9ff';
      starCx.beginPath();
      starCx.arc(s.x*W, s.y*H, s.r, 0, 6.2832);
      starCx.fill();
    }
    starCx.globalAlpha = 1;

    /* ---- pollen / leaves / dust ---- */
    pCx.clearRect(0,0,W,H);
    var pa = ramp(pv, 0.58, 0.8);
    if (pa > 0.01 && !reduced){
      for (i = 0; i < parts.length; i++){
        var q = parts[i];
        if (q.kind === 'leaf'){
          q.sway += dt*1.6;
          q.x += (q.vx + Math.sin(q.sway)*10)*dt;
          q.y += (q.vy + Math.cos(q.sway*0.7)*5)*dt;
          q.rot += q.vr*dt;
          if (q.y > H+20 || q.x < -30){ q.x = W + 20 + Math.random()*60; q.y = Math.random()*H*0.5; }
          pCx.save();
          pCx.translate(q.x, q.y); pCx.rotate(q.rot);
          pCx.globalAlpha = pa*0.8;
          pCx.fillStyle = i % 3 === 0 ? '#ef7ab8' : '#3f7d55';
          pCx.beginPath(); pCx.ellipse(0, 0, q.s, q.s*0.42, 0, 0, 6.2832); pCx.fill();
          pCx.restore();
        } else if (q.kind === 'spore'){
          q.ph += dt;
          q.x += (q.vx + Math.sin(q.ph)*4)*dt;
          q.y += q.vy*dt;
          if (q.y < -10){ q.y = H + 10; q.x = Math.random()*W; }
          if (q.x < -10) q.x = W+10; if (q.x > W+10) q.x = -10;
          var g = 0.5 + 0.5*Math.sin(q.ph*2);
          pCx.globalAlpha = pa*(0.25 + 0.4*g);
          pCx.fillStyle = '#ffe2f1';
          pCx.beginPath(); pCx.arc(q.x, q.y, q.s, 0, 6.2832); pCx.fill();
        } else {
          q.ph += dt*0.7;
          q.x += q.vx*dt; q.y += q.vy*dt;
          if (q.x < 0) q.x = W; if (q.x > W) q.x = 0;
          if (q.y < 0) q.y = H; if (q.y > H) q.y = 0;
          pCx.globalAlpha = pa*(0.1 + 0.12*Math.sin(q.ph));
          pCx.fillStyle = '#dceefc';
          pCx.beginPath(); pCx.arc(q.x, q.y, q.s, 0, 6.2832); pCx.fill();
        }
      }
      pCx.globalAlpha = 1;
    }

    /* ---- ACT 2: the foundry answers ---- */
    if (ACT2.started && !ACT3.started){
      var t2 = (now - ACT2.t0)/1000;
      var red = ramp(t2, 1, 26);
      skyDoom.style.opacity = red * 0.97;
      doomTint.style.opacity = red * 0.62;
      haze.style.opacity = 1 - red;
      cirrus.style.opacity = 0.28 * (1 - red);
      toxicG.setAttribute('opacity', ramp(t2, 6, 30) * 0.95);
      dogfight.style.opacity = ramp(t2, 3, 6);
      cityLife.setAttribute('opacity', 1 - ramp(t2, 1.5, 5));

      var flash = 0, quake = 0.1 * ramp(t2, 0, 2);
      for (i = 0; i < STRIKES.length; i++){
        var s = STRIKES[i], tau = t2 - s.t;
        if (tau < 0) continue;
        var life = 2.2 + s.fall + 0.4;
        if (tau < life){
          s.beam.setAttribute('opacity', (0.7 + 0.3*Math.sin(tau*23)) * ramp(tau, 0, 0.12) * (1 - ramp(tau, life - 0.5, life)));
          var sink = 0;
          if (tau > 2.2) sink = Math.min((s.drop || 880) * Math.pow(clamp01((tau - 2.2)/s.fall), 2), 620 - s.hy);
          if (sink !== s.lastSink){
            s.lastSink = sink;
            var yb = s.hy + sink;
            for (var b = 0; b < s.lines.length; b++) s.lines[b].setAttribute('y2', yb);
            for (b = 0; b < s.dots.length; b++) s.dots[b].setAttribute('cy', yb);
            if (s.spark) s.spark.setAttribute('transform', 'translate(0,' + sink + ')');
          }
        } else s.beam.setAttribute('opacity', 0);
        flash = Math.max(flash, 0.5 * Math.exp(-tau * 2.2));
        quake += 0.45 * Math.exp(-tau * 1.4);
        var tf;
        if (tau < 2.2){
          var amp = 2.4 * ramp(tau, 0, 0.4);
          tf = 'translate(' + (Math.sin(now*0.045 + i*2.1)*amp).toFixed(2) + ',' + (Math.cos(now*0.052 + i)*amp*0.5).toFixed(2) + ')';
        } else {
          var u = clamp01((tau - 2.2) / s.fall);
          var uu = u*u;
          var dy = (s.drop || 880) * uu;
          tf = 'translate(0,' + dy.toFixed(1) + ') rotate(' + (s.ang * Math.min(1, uu*1.6)).toFixed(2) + ' ' + s.px + ' ' + s.py + ')';
          if (u >= 1) s.smoke.setAttribute('opacity', Math.min(0.9, 0.25 + (tau - 2.2 - s.fall) * 0.5));
          quake += (u < 1 ? 0.25 : 0.5 * Math.exp(-(tau - 2.2 - s.fall) * 1.6));
        }
        s.tw.setAttribute('transform', tf);
        for (var j2 = 0; j2 < s.extras.length; j2++) s.extras[j2].setAttribute('transform', tf);
      }
      strikeFlash.style.opacity = flash;
      ACT2.shake = reduced ? 0 : Math.min(quake, 1.2) * 0.18;

      // act-2 reports
      var want2 = -1;
      for (k = 0; k < CAPS2.length; k++) if (t2 >= CAPS2[k].a && t2 <= CAPS2[k].b){ want2 = k; break; }
      if (want2 !== curCap2){
        curCap2 = want2;
        if (want2 >= 0){ capSm.textContent = CAPS2[want2].k; capTx.textContent = CAPS2[want2].t; }
      }
      if (want2 >= 0){
        var c2 = CAPS2[want2];
        capEl.style.opacity = ramp(t2, c2.a, c2.a + 1.2) * (1 - ramp(t2, c2.b - 1.2, c2.b)) * 0.92;
      } else capEl.style.opacity = 0;

      if (t2 > 33) contBtn2.classList.add('on');
    } else if (ACT3.started){
      // climb-out: red cast thins with altitude but never leaves, even in space
      skyDoom.style.opacity = 0.2 + 0.77 * pv;
      doomTint.style.opacity = 0.32 + 0.3 * pv;
      strikeFlash.style.opacity = 0;
      dogfight.style.opacity = 1 - ramp(u3, 0.15, 0.5);
      spaceBattle.setAttribute('opacity', ramp(u3, 0.3, 0.65));
      ACT2.shake = reduced ? 0 : 0.3 * Math.exp(-t3 * 0.9);

      // hero shuttle: lifts from behind the right peaks, camera chases it up
      var lift = 1 - Math.pow(1 - clamp01(u3 / 0.75), 2.4);
      var ay = 92 - 74 * lift + Math.sin(now * 0.0011) * 0.8;
      var ax = 82 - 28 * (u3 < .5 ? 2*u3*u3 : 1 - Math.pow(-2*u3 + 2, 2)/2) + Math.sin(now * 0.0007) * 1.1;
      ascent.style.opacity = 1;
      ascent.style.transform = 'translate3d(' + ax + 'vw,' + ay + 'vh,0) rotate(' + (Math.sin(now*0.0009)*2 - 3) + 'deg)';

      // act-3 reports
      var want3 = -1;
      for (k = 0; k < CAPS3.length; k++) if (t3 >= CAPS3[k].a && t3 <= CAPS3[k].b){ want3 = k; break; }
      if (want3 !== curCap3){
        curCap3 = want3;
        if (want3 >= 0){ capSm.textContent = CAPS3[want3].k; capTx.textContent = CAPS3[want3].t; }
      }
      if (want3 >= 0){
        var c3 = CAPS3[want3];
        capEl.style.opacity = ramp(t3, c3.a, c3.a + 1) * (1 - ramp(t3, c3.b - 1, c3.b)) * 0.92;
      } else capEl.style.opacity = 0;
    }

    // touchdown
    if (raw >= 1 && !done){ done = true; replayBtn.classList.add('on'); }
    if (done && !ACT2.started){
      if (contReadyAt === null) contReadyAt = now;
      if (now - contReadyAt > 3000) contBtn.classList.add('on');
    }

    requestAnimationFrame(frame);
  }

  replayBtn.addEventListener('click', function(){
    done = false; t0 = null; curCap = -1;
    resetAct2();
    replayBtn.classList.remove('on');
    fader.style.transition = 'opacity 1.2s ease';
    fader.style.opacity = 1;
    setTimeout(function(){
      t0 = null;
      fader.style.transition = 'opacity 2.8s ease';
      fader.style.opacity = 0;
    }, 1300);
  });

  // fade up from black and begin the shot
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ fader.style.opacity = 0; });
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
